<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Parts Tracker Bridge</title>

<!-- Condensed headings like a shop-floor board; LUNA Parts' Instrument Sans for fields. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="icon" href="/icon.png" />

<style>
  /* 6328-style layout (pill "chips" instead of dropdowns, sticky footer)
     in Team 316 LUNATECS colors: black, white and the logo's yellow. The
     yellow is only used on black, where it's easy to read. */
  :root {
    --bg: #ffffff;
    --card: #ffffff;
    --field: #ffffff;
    --line: #e4e4e7;
    --text: #1b1b18;
    --muted: #71717a;
    --accent: #1b1b18;
    --accent-ink: #ccff00;  /* LUNATECS yellow: only ever on black */
    --brand: #ccff00;
    --header: #111111;
    --good: #16a34a;
    --bad: #dc2626;
    --pending: #d97706;
    --heading: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Instrument Sans', ui-sans-serif, system-ui, sans-serif;
    font-size: 13px;
  }

  .panel { padding: 0 10px 84px; }

  /* ---- Header + tabs ---- */
  /* Black header band running edge to edge, with the yellow logo. */
  .masthead { background: var(--header); margin: 0 -10px; padding: 0 10px; }
  .top {
    display: flex; align-items: center; gap: 9px;
    padding: 10px 0 8px;
    border-bottom: 1px solid #333333;
  }
  .top img { height: 30px; width: auto; flex-shrink: 0; }
  .brand { white-space: nowrap; font-family: var(--heading); font-weight: 700; font-size: 15px; letter-spacing: 0.05em; line-height: 1; color: #ffffff; }
  .sub { font-family: var(--heading); font-weight: 500; font-size: 10.5px; letter-spacing: 0.12em; color: #b4b4b4; margin-top: 3px; }
  .doc { margin-left: auto; font-size: 10px; color: #b4b4b4; white-space: nowrap; }

  .tabs { display: flex; align-items: center; gap: 14px; }
  .tab {
    font-family: var(--heading); font-weight: 600; font-size: 14px; letter-spacing: 0.08em;
    color: #9a9a9a; background: none; border: none; padding: 8px 0 6px;
    border-bottom: 3px solid transparent; cursor: pointer;
  }
  .tab.active { color: #ffffff; border-bottom-color: var(--brand); }
  .tab:disabled { cursor: default; opacity: 0.5; }
  .tab-link {
    font-family: var(--heading); font-weight: 600; font-size: 12px;
    letter-spacing: 0.08em; color: var(--brand); text-decoration: none;
  }

  .status { display: flex; align-items: center; gap: 6px; margin: 8px 0; font-size: 11.5px; color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pending); flex-shrink: 0; }
  .status.good .dot { background: var(--good); }
  .status.bad .dot { background: var(--bad); }
  .status.bad { color: var(--bad); }
  .status.pending .dot { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.25; } }
  .status a { color: inherit; font-weight: 700; margin-left: 4px; cursor: pointer; }

  /* ---- Form ---- */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 11px 8px;
  }

  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field.full { grid-column: 1 / -1; }

  label {
    font-family: var(--heading); font-weight: 600; font-size: 11.5px;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
  }
  .req { color: #ef4444; margin-left: 2px; }

  input, select, textarea {
    width: 100%;
    font: inherit;
    font-size: 12.5px;
    color: var(--text);
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 6px 8px;
    outline: none;
  }
  input::placeholder, textarea::placeholder { color: #a1a1aa; }
  select { padding-right: 4px; }
  select option { background: var(--field); color: var(--text); }
  textarea { resize: vertical; min-height: 44px; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  select:disabled, input:disabled { color: var(--muted); opacity: 0.7; }

  /* Chips: a select with class "chips" stays in the page (the code reads
     and sets it as before) but is hidden behind a row of pills. */
  select.chips { display: none; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip {
    font: inherit; font-size: 12px; font-weight: 500;
    color: var(--text); background: var(--field);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 10px; cursor: pointer; line-height: 1.3;
  }
  .chip:hover { border-color: #a1a1aa; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .chip-empty { font-size: 11.5px; color: var(--muted); padding: 3px 0; }

  /* ---- Sticky footer ---- */
  .footer {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--card);
    border-top: 1px solid var(--line);
    padding: 8px 10px;
    display: flex; flex-direction: column; gap: 5px;
  }
  .btn {
    width: 100%;
    font-family: var(--heading); font-weight: 700; font-size: 15px; letter-spacing: 0.08em;
    color: var(--accent-ink);
    background: var(--accent);
    border: none;
    border-radius: 8px;
    padding: 8px;
    cursor: pointer;
  }
  .btn:disabled { background: var(--line); color: var(--muted); cursor: default; }
  .footer-row { display: flex; align-items: center; gap: 8px; }
  .footer-row[hidden] { display: none; }
  .footer-row .btn { flex: 1; }
  .count { font-size: 12px; font-weight: 600; white-space: nowrap; }
  .btn.ghost { background: #ffffff; color: var(--text); border: 1px solid var(--line); flex: 0 0 34%; }

  /* ---- Use Selection banner ---- */
  .banner {
    display: flex; align-items: center; gap: 8px;
    background: #ecfccb; border: 1px solid #a3e635; border-radius: 8px;
    padding: 6px 6px 6px 10px; margin-bottom: 10px;
    font-size: 12px; font-weight: 500; color: #1a2e05;
  }
  .banner[hidden] { display: none; }
  .banner span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .banner button {
    font-family: var(--heading); font-weight: 700; font-size: 12px; letter-spacing: 0.06em;
    background: var(--accent); color: var(--accent-ink); border: none; border-radius: 6px;
    padding: 5px 9px; cursor: pointer; white-space: nowrap;
  }

  /* ---- Part namer: black bar, yellow text (yellow only ever on black) ---- */
  .namer {
    background: var(--accent); color: #ffffff; border-radius: 10px;
    padding: 9px 10px; margin-bottom: 8px; font-size: 12px;
  }
  .namer[hidden] { display: none; }
  .namer-title { font-family: var(--heading); font-weight: 700; letter-spacing: 0.08em; color: var(--accent-ink); font-size: 13px; }
  .namer-row { display: flex; align-items: center; gap: 6px; margin-top: 7px; }
  .namer input {
    width: 84px; padding: 4px 6px; font-size: 13px; font-weight: 600;
    background: #ffffff; color: #111111; border: 1px solid #ffffff; border-radius: 6px; box-shadow: none;
  }
  .namer-next { flex: 1; min-width: 0; font-weight: 600; }
  .namer-next b { color: var(--accent-ink); font-size: 14px; }
  .namer button {
    font-family: var(--heading); font-weight: 700; font-size: 12px; letter-spacing: 0.06em;
    background: transparent; color: #ffffff; border: 1px solid #52525b; border-radius: 6px;
    padding: 4px 8px; cursor: pointer;
  }
  .namer button.go { background: var(--accent-ink); color: #111111; border-color: var(--accent-ink); }
  .namer button:disabled { opacity: 0.4; cursor: default; }
  .namer-msg { margin-top: 6px; color: #d4d4d8; min-height: 0; }
  .namer-msg:empty { display: none; }
  .namer-msg.bad { color: #fca5a5; }
  .namer-msg a { color: var(--accent-ink); }

  /* ---- Parts checklist ---- */
  #listScreen .field { margin-bottom: 12px; }
  .sublabel { font-weight: 500; letter-spacing: 0.04em; text-transform: none; }
  .list-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
  .list-tools { display: flex; gap: 4px; }
  .mini {
    font-family: var(--heading); font-weight: 700; font-size: 11px; letter-spacing: 0.06em;
    color: var(--text); background: #ffffff; border: 1px solid var(--line); border-radius: 6px;
    padding: 3px 7px; cursor: pointer;
  }
  .mini:hover { border-color: #a1a1aa; }
  .mini.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .mini[hidden] { display: none; }
  .drawing-row { display: flex; gap: 6px; align-items: center; }
  .drawing-row select { flex: 1; min-width: 0; }
  .drawing-row .mini { white-space: nowrap; padding: 6px 8px; }
  .part-list { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .part-row {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 10px; border-bottom: 1px solid var(--line); cursor: pointer;
    font-family: inherit; text-transform: none; letter-spacing: normal; color: var(--text);
  }
  .part-row:last-child { border-bottom: none; }
  .part-row.on { background: #f4f4f5; }
  .part-row input { width: 15px; height: 15px; margin: 0; accent-color: var(--accent); flex-shrink: 0; box-shadow: none; }
  .part-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .part-name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .part-sub { font-size: 11px; color: var(--muted); }
  .part-sub.good { color: var(--good); }
  .part-sub.bad { color: var(--bad); }
  .part-list .chip-empty { display: block; padding: 10px; margin: 0; }
  .tag {
    font-family: var(--heading); font-weight: 700; font-size: 10.5px; letter-spacing: 0.08em;
    color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px;
  }
  .tag.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .qty { font-weight: 700; color: var(--text); }
  .twin { display: block; font-size: 11px; color: var(--text); margin-top: 1px; }
  .twin.ask { color: var(--bad); }
  .twin button {
    font-family: var(--heading); font-weight: 700; font-size: 10px; letter-spacing: 0.08em; margin-left: 4px;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 4px; padding: 1px 5px; cursor: pointer;
  }
  .part-row.found .twin { color: #e4e4e7; }
  /* SEE: a picture of the part, since Onshape can't highlight inside an assembly. */
  .see {
    font-family: var(--heading); font-weight: 700; font-size: 10.5px; letter-spacing: 0.08em;
    color: var(--text); background: #ffffff; border: 1px solid var(--line); border-radius: 4px;
    padding: 1px 5px; cursor: pointer; flex-shrink: 0;
  }
  .see:hover, .see.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  /* A row found by clicking the part in the 3D view. */
  .part-row.found { background: var(--accent); color: #ffffff; transition: background 0.3s; }
  .part-row.found .part-name { color: var(--accent-ink); }
  .part-row.found .part-sub, .part-row.found .qty { color: #e4e4e7; }
  .peek {
    position: fixed; z-index: 50; width: 190px; background: #ffffff; border: 1px solid var(--accent);
    border-radius: 8px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18); padding: 6px; pointer-events: none;
  }
  .peek[hidden] { display: none; }
  .card-pic { margin: 0 0 10px; border: 1px solid var(--line, #ddd); border-radius: 6px; padding: 6px; background: #fafafa; }
  .card-pic[hidden] { display: none; }
  .card-pic img { display: block; width: 100%; height: 150px; object-fit: contain; cursor: zoom-in; }
  .card-pic.big img { height: 320px; cursor: zoom-out; }
  .card-pic figcaption { font-size: 11px; color: var(--muted); text-align: center; margin-top: 4px; }
  .peek img { display: block; width: 100%; height: 160px; object-fit: contain; background: #fafafa; border-radius: 4px; }
  .peek .peek-name { font-size: 12px; font-weight: 700; margin-top: 5px; }
  .peek .peek-sub { font-size: 11px; color: var(--muted); }
  /* Assembly hardware sits under a fold at the bottom of the list. */
  .hw-fold { border-top: 1px solid var(--line); }
  .hw-fold summary {
    padding: 7px 10px; cursor: pointer; font-family: var(--heading); font-weight: 700;
    font-size: 12px; letter-spacing: 0.08em; color: var(--muted); background: #fafafa;
  }
  .hw-fold[open] summary { border-bottom: 1px solid var(--line); }

  /* ---- One part at a time ---- */
  .card-head { display: flex; align-items: center; justify-content: space-between; }
  .card-title { font-family: var(--heading); font-weight: 700; font-size: 22px; letter-spacing: 0.03em; margin: 2px 0 8px; }
  /* Upload feedback: a toast above the footer, and the next part slides in. */
  .toast {
    position: fixed; left: 10px; right: 10px; bottom: 64px; z-index: 5;
    background: var(--accent); color: var(--accent-ink);
    font-family: var(--heading); font-weight: 700; font-size: 13px; letter-spacing: 0.05em;
    padding: 8px 12px; border-radius: 8px; text-align: center;
    opacity: 0; transform: translateY(8px); transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: none; }
  @keyframes slide-in { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
  #cardScreen.slide { animation: slide-in 0.28s ease-out; }
  @keyframes press { 0% { transform: scale(0.94); } 100% { transform: scale(1); } }
  .btn.pressed { animation: press 0.3s ease-out; }

  .upload-status { font-size: 11px; color: var(--muted); margin: 4px 0 0; min-height: 0; }
  .upload-status:empty { display: none; }
  .upload-status.bad { color: var(--bad); }
  .tag.bad { color: var(--bad); border-color: var(--bad); }
  .badge {
    font-family: var(--heading); font-weight: 700; font-size: 12px; letter-spacing: 0.06em;
    background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 2px 9px;
  }

  .hint { font-size: 10.5px; color: var(--muted); text-align: center; margin: 0; }
  .hint.good { color: var(--good); font-weight: 500; }
  .hint.bad { color: var(--bad); }
  .hint.left { text-align: left; margin-top: 3px; }
  .hint.warn { color: #92400e; background: #fef3c7; border-radius: 6px; padding: 4px 7px; }
  .hint:empty { display: none; }
  .check-row { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 500; text-transform: none; letter-spacing: normal; cursor: pointer; }
  .check-row input { width: 15px; height: 15px; margin: 0; accent-color: var(--accent); box-shadow: none; }

  .link {
    font: inherit;
    font-size: 11px;
    color: var(--muted);
    background: none;
    border: none;
    padding: 0;
    text-decoration: underline;
    cursor: pointer;
  }

  details { margin-top: 12px; }
  summary { font-size: 11.5px; color: var(--muted); cursor: pointer; }
  #logWindow {
    margin-top: 6px;
    max-height: 140px;
    overflow-y: auto;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 6px 8px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 10px;
    line-height: 1.5;
  }
  #logWindow a { color: var(--accent); }
  #logWindow .time { color: var(--muted); }
  #logWindow .success { color: var(--good); }
  #logWindow .error { color: var(--bad); }
</style>
</head>

<body>
<div class="panel">

  <div class="masthead">
  <header class="top">
    <img src="/logo-yellow.png" alt="LUNATECS 316" />
    <div>
      <div class="brand">PARTS TRACKER BRIDGE</div>
      <div class="sub">ONSHAPE &rarr; LUNA PARTS</div>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" type="button">PARTS</button>
    <button class="tab" type="button" disabled title="Coming soon">HISTORY</button>
    <span id="docInfo" class="doc"></span>
    <a class="tab-link" href="https://build.lunatecs.org" target="_blank" rel="noopener">LUNA &#8599;</a>
  </nav>
  </div>

  <div id="status" class="status"><span class="dot"></span><span id="statusText">Connecting to LUNA Parts&hellip;</span></div>

  <!-- Shown when something is clicked in Onshape; nothing changes until
       Use Selection is pressed. -->
  <div id="selBanner" class="banner" hidden>
    <span id="selText"></span>
    <button id="useSelBtn" type="button">USE SELECTION</button>
  </div>

  <!-- ---- Screen 1: pick the project and tick parts ---- -->
  <section id="listScreen">
    <div class="field">
      <label for="projectSelect">Project <span class="sublabel">(applies to all parts)</span></label>
      <select id="projectSelect" disabled><option value="">Loading projects&hellip;</option></select>
    </div>

    <div class="list-head">
      <label id="listLabel">Parts</label>
      <span class="list-tools">
        <button id="nameBtn" class="mini" type="button" title="Number parts by clicking them in Onshape">NAME</button>
        <button id="refreshBtn" class="mini" type="button" title="Reload parts from Onshape">&#8635;</button>
        <button id="allBtn" class="mini" type="button">ALL</button>
        <button id="clearBtn" class="mini" type="button">CLEAR</button>
      </span>
    </div>
    <!-- Assign names: each part clicked in Onshape gets the next number. -->
    <div id="namer" class="namer" hidden>
      <div class="namer-title">ASSIGN NAMES &middot; CLICK PARTS IN ONSHAPE</div>
      <div class="namer-row">
        <input id="namerPrefix" type="text" maxlength="16" value="26O-E" aria-label="Name prefix" spellcheck="false" />
        <span class="namer-next">Next: <b id="namerNext">&hellip;</b></span>
      </div>
      <div class="namer-row">
        <button id="namerUndo" type="button" disabled>UNDO</button>
        <span style="flex:1"></span>
        <button id="namerDone" class="go" type="button">DONE</button>
      </div>
      <div id="namerMsg" class="namer-msg"></div>
    </div>
    <div id="partList" class="part-list"><p class="chip-empty">Loading parts&hellip;</p></div>
  </section>

  <!-- ---- Screen 2: one part at a time ---- -->
  <section id="cardScreen" hidden>
    <div class="card-head">
      <button id="backBtn" class="link" type="button">&larr; Parts</button>
      <span id="cardCount" class="badge"></span>
    </div>
    <p id="uploadStatus" class="upload-status"></p>
    <h2 id="cardTitle" class="card-title"></h2>
    <!-- A picture of the part, so it's clear which one this is (an
         assembly can't highlight it in 3D). Tap to make it bigger. -->
    <figure id="cardPic" class="card-pic" hidden>
      <img id="cardPicImg" alt="" title="Tap to make bigger" />
      <figcaption id="cardPicSub"></figcaption>
    </figure>

    <form id="partForm" class="card" autocomplete="off">
      <div class="field full">
        <label for="cardProjectSelect">Project<span class="req">*</span> <span id="projectWhy" class="sublabel"></span></label>
        <!-- Each LUNA project is a robot subsystem; picked from the part
             number (26O-E001 -> the Elevator project) when it can be. -->
        <select id="cardProjectSelect" disabled><option value="">Loading projects&hellip;</option></select>
      </div>
      <div class="field">
        <label for="nameInput">Name<span class="req">*</span></label>
        <input id="nameInput" type="text" maxlength="255" />
      </div>
      <div class="field">
        <label for="partNumberInput">Part Number</label>
        <input id="partNumberInput" type="text" maxlength="255" placeholder="Auto" />
      </div>

      <div class="field full">
        <label for="statusSelect">Status<span class="req">*</span></label>
        <!-- Filled from the statuses existing LUNA parts use (the API has no
             status list); defaults to "Designed". -->
        <select id="statusSelect" class="chips" disabled><option value="">Loading&hellip;</option></select>
      </div>

      <div class="field full">
        <label for="toolSelect">Machine</label>
        <select id="toolSelect" class="chips" disabled><option value="">Loading&hellip;</option></select>
        <p id="toolWhy" class="hint left"></p>
      </div>

      <div class="field full">
        <label for="materialInput">Material</label>
        <input id="materialInput" type="text" maxlength="255" />
        <p id="materialWarn" class="hint left warn"></p>
      </div>

      <div class="field full">
        <label for="thicknessSelect">Thickness</label>
        <select id="thicknessSelect" class="chips" disabled><option value="">Loading&hellip;</option></select>
      </div>

      <div class="field full">
        <label for="typeSelect">Type<span class="req">*</span></label>
        <select id="typeSelect" class="chips">
          <option value="part">Part</option>
          <option value="assembly">Assembly</option>
          <option value="purchased">Purchased</option>
        </select>
      </div>

      <div class="field full">
        <label for="prioritySelect">Priority</label>
        <select id="prioritySelect" class="chips">
          <option value="0">Low</option>
          <option value="1" selected>Normal</option>
          <option value="2">High</option>
        </select>
      </div>

      <div class="field">
        <label for="quantityInput">Quantity<span class="req">*</span></label>
        <input id="quantityInput" type="number" min="0" step="1" value="1" />
      </div>
      <div class="field">
        <label for="leadTimeInput">Lead Time (Days)</label>
        <input id="leadTimeInput" type="number" min="0" step="1" />
      </div>

      <div class="field">
        <label for="cutLengthInput">Cut Length</label>
        <input id="cutLengthInput" type="number" min="0" step="any" />
      </div>
      <div class="field">
        <label for="parentSelect">Parent Assembly</label>
        <select id="parentSelect" disabled><option value="">None</option></select>
      </div>

      <div class="field full">
        <label for="drawingSelect">Drawing</label>
        <!-- Picked automatically from the part name (e.g. part E05 ->
             "E05 Drawing 1"); exported to PDF and attached on Upload, along
             with a DXF of the part's flat face. -->
        <div class="drawing-row">
          <select id="drawingSelect" disabled><option value="">Loading&hellip;</option></select>
          <!-- Makes an Onshape drawing in the team's layout (see drawings.js). -->
          <button id="makeDrawingBtn" class="mini" type="button" hidden>MAKE DRAWING</button>
        </div>
        <p id="attachHint" class="hint left"></p>
        <label class="check-row"><input id="autoDrawInput" type="checkbox" checked /> Make a drawing on Upload if there isn't one</label>
        <label class="check-row"><input id="stepInput" type="checkbox" /> Also attach a STEP file</label>
      </div>

      <div class="field full">
        <label for="descriptionInput">Description</label>
        <textarea id="descriptionInput" rows="2"></textarea>
      </div>
    </form>
  </section>

  <!-- ---- Screen 3: what happened ---- -->
  <section id="doneScreen" hidden>
    <h2 id="doneTitle" class="card-title">Done</h2>
    <div id="doneList" class="part-list"></div>
  </section>

  <details>
    <summary>Sync log</summary>
    <div id="logWindow"></div>
  </details>

</div>

<div id="toast" class="toast" role="status"></div>

<div class="footer">
  <p id="footerHint" class="hint"></p>
  <div id="listFooter" class="footer-row">
    <span id="checkedCount" class="count">0 parts selected</span>
    <button id="startBtn" class="btn" type="button" disabled>CREATE PARTS &rarr;</button>
  </div>
  <div id="cardFooter" class="footer-row" hidden>
    <button id="skipBtn" class="btn ghost" type="button">SKIP</button>
    <button id="submitBtn" class="btn" type="button">&#8593; UPLOAD</button>
  </div>
  <div id="doneFooter" class="footer-row" hidden>
    <button id="againBtn" class="btn" type="button">BACK TO PARTS</button>
  </div>
</div>

<script>
(function () {
  // The panel has three screens, like 6328's MFG Pipeline:
  //   1. list:  pick the project and tick parts from the Part Studio
  //   2. card:  one part at a time ("2 of 5"), Skip or Upload
  //   3. done:  what was created, skipped or failed
  // Upload queues the part; it is created in LUNA and its DXF and drawing
  // PDF attached in the background while the next part is filled in.
  const state = {
    context: null,
    drawingRuns: new Map(), // partId -> pending make-drawing request, so each part makes one at a time
    drawings: [],
    parts: [],             // [{ partId, name, material, quantity, group }] from Onshape
    kind: 'partstudio',    // or 'assembly'
    checked: new Set(),    // partIds ticked on the list
    faces: new Map(),      // partId -> { faceId, flatFace } from Use Selection
    queue: [],             // partIds being stepped through
    step: 0,
    results: [],           // { name, outcome: 'created'|'skipped', detail, kind }
    pendingSelection: null,
  };

  const el = (id) => document.getElementById(id);
  const statusBox = el('status');
  const statusText = el('statusText');
  const projectSelect = el('projectSelect');
  const toolSelect = el('toolSelect');
  const thicknessSelect = el('thicknessSelect');
  const statusSelect = el('statusSelect');
  const parentSelect = el('parentSelect');
  const cardProjectSelect = el('cardProjectSelect');
  const drawingSelect = el('drawingSelect');
  const attachHint = el('attachHint');
  const footerHint = el('footerHint');
  const logWindow = el('logWindow');

  // ---- Chips ---------------------------------------------------------------
  // Each <select class="chips"> is drawn as a row of pills. The select stays
  // the source of truth, so the rest of the code reads and sets .value as
  // usual and the pills follow along.
  const chipRenderers = [];
  const selectValue = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value');

  function chipify(select) {
    const row = document.createElement('div');
    row.className = 'chip-row';
    select.after(row);

    function render() {
      row.innerHTML = '';
      const options = [...select.options].filter((o) => o.value !== '');
      if (!options.length) {
        const empty = document.createElement('span');
        empty.className = 'chip-empty';
        empty.textContent = select.options[0] ? select.options[0].textContent : '';
        row.appendChild(empty);
        return;
      }
      const canClear = [...select.options].some((o) => o.value === '');
      for (const option of options) {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = option.value === select.value ? 'chip on' : 'chip';
        // "Designed (Part has been designed)" -> "Designed"; full text on hover.
        chip.textContent = option.textContent.replace(/\s*\(.*\)\s*$/, '');
        chip.title = option.textContent;
        chip.addEventListener('click', () => {
          // Tapping the picked chip again clears it, where blank is allowed.
          select.value = option.value === select.value && canClear ? '' : option.value;
          select.dispatchEvent(new Event('change', { bubbles: true }));
        });
        row.appendChild(chip);
      }
    }

    Object.defineProperty(select, 'value', {
      configurable: true,
      get() { return selectValue.get.call(this); },
      set(v) { selectValue.set.call(this, v); render(); },
    });
    new MutationObserver(render).observe(select, { childList: true });
    chipRenderers.push(render);
    render();
  }

  document.querySelectorAll('select.chips').forEach(chipify);
  // form.reset() changes values without going through the setter.
  el('partForm').addEventListener('reset', () => setTimeout(() => chipRenderers.forEach((r) => r())));

  function log(message, kind) {
    const time = new Date().toLocaleTimeString('en-US', { hour12: false });
    const line = document.createElement('div');
    if (kind) line.className = kind;
    line.innerHTML = `<span class="time">${time}</span> ${message}`;
    logWindow.appendChild(line);
    logWindow.scrollTop = logWindow.scrollHeight;
  }

  function setStatus(text, kind, retry) {
    statusBox.className = `status ${kind}`;
    statusText.textContent = text;
    if (retry) {
      const link = document.createElement('a');
      link.textContent = 'Try again';
      link.addEventListener('click', retry);
      statusText.appendChild(link);
    }
  }

  function fillSelect(select, items, placeholder, label = (item) => item.name) {
    select.innerHTML = '';
    const blank = document.createElement('option');
    blank.value = '';
    blank.textContent = placeholder;
    select.appendChild(blank);
    for (const item of items) {
      const option = document.createElement('option');
      option.value = item.id;
      option.textContent = label(item);
      select.appendChild(option);
    }
    select.disabled = items.length === 0;
  }

  function showHint(message, kind = '') {
    footerHint.className = `hint ${kind}`;
    footerHint.textContent = message;
  }

  async function getJson(url, options = {}) {
    const res = await fetch(url, { credentials: 'include', ...options });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      const err = new Error(body.error || `Server returned ${res.status}`);
      err.status = res.status;
      err.body = body;
      throw err;
    }
    return body;
  }

  // ---- Screens -------------------------------------------------------------
  function showScreen(name) {
    try { peek.reset(); } catch (err) { /* not set up yet during start-up */ }
    for (const s of ['list', 'card', 'done']) {
      el(`${s}Screen`).hidden = s !== name;
      el(`${s}Footer`).hidden = s !== name;
    }
    state.screen = name;
    showHint('');
    saveProgress();
    window.scrollTo(0, 0);
    updateBanner();
  }

  // ---- Load projects/tools/thicknesses from LUNA Parts (read-only) -------
  // The Onshape side (session, parts list) loads on its own, so the part list
  // still appears while LUNA Parts is slow or down. A failed LUNA load is
  // retried a couple of times, since the server may be waking up.
  const LUNA_TRIES = 3;
  async function connect() {
    loadOnshapeSide();
    await connectLuna();
  }

  async function connectLuna() {
    for (const s of [projectSelect, cardProjectSelect]) {
      s.innerHTML = '<option value="">Loading projects&hellip;</option>';
      s.disabled = true;
    }
    for (let attempt = 1; attempt <= LUNA_TRIES; attempt += 1) {
      setStatus(attempt === 1 ? 'Connecting to LUNA Parts\u2026' : `Still connecting to LUNA Parts (try ${attempt} of ${LUNA_TRIES})\u2026`, 'pending');
      if (attempt === 1) log('Loading lists from LUNA Parts&hellip;');
      try {
        const res = await fetch('/api/luna/options', { credentials: 'include' });
        const body = await res.json().catch(() => ({}));
        if (res.status === 401) {
          setStatus('Not logged in to Onshape', 'bad');
          log('Log in with Onshape first: <a href="/oauth/login">connect</a>', 'error');
          return;
        }
        if (!res.ok) throw new Error(body.error || `Server returned ${res.status}`);

        setStatus('Loading projects\u2026', 'pending');
        state.projects = body.projects;
        state.tools = body.tools;
        fillSelect(projectSelect, body.projects, body.projects.length ? 'Select project' : 'No projects');
        fillSelect(cardProjectSelect, body.projects, 'Select project');
        fillSelect(toolSelect, body.tools, 'Select tool');
        fillSelect(thicknessSelect, body.thicknesses, 'Select thickness');

        setStatus('Connected to LUNA Parts', 'good');
        log(`Loaded ${body.projects.length} projects, ${body.tools.length} tools, ${body.thicknesses.length} thicknesses.`, 'success');
        loadStatuses().then(markLunaReady);
        loadUploaded();
        if (state.context) restoreProject();
        updateListFooter();
        return;
      } catch (err) {
        log(`LUNA Parts: ${err.message}`, 'error');
        if (attempt < LUNA_TRIES) await new Promise((r) => setTimeout(r, 2000 * attempt));
      }
    }
    setStatus('Could not reach LUNA Parts.', 'bad', () => connectLuna());
    for (const s of [projectSelect, cardProjectSelect, toolSelect, thicknessSelect]) {
      s.innerHTML = '<option value="">Unavailable</option>';
    }
    updateListFooter();
  }

  async function loadOnshapeSide() {
    try {
      // Set when the panel was opened from inside Onshape (the extension's Action URL).
      const session = await getJson('/api/session');
      state.context = session.context;
      if (session.context) {
        el('docInfo').textContent = `DOC ${session.context.documentId.slice(0, 6)}`;
        log(`Opened in Onshape document ${session.context.documentId.slice(0, 6)}&hellip;`);
        if (state.projects) restoreProject();
        loadDrawings();
        listenForSelections(session.context);
        loadParts();
      } else {
        log('Not opened from Onshape (no document info).');
        el('partList').innerHTML = '<p class="chip-empty">Open this panel from inside an Onshape Part Studio to see its parts.</p>';
        fillSelect(drawingSelect, [], 'Only available inside Onshape');
      }
    } catch (err) {
      el('partList').innerHTML = '<p class="chip-empty">Couldn\u2019t reach the panel\u2019s server. Close and reopen the panel.</p>';
      log(err.message, 'error');
    }
  }

  // ---- Parent Assembly depends on the chosen project ---------------------
  let loadedAssembliesFor = '';
  async function loadAssemblies(projectId) {
    loadedAssembliesFor = projectId || '';
    fillSelect(parentSelect, [], 'None');
    if (!projectId) return;

    try {
      const body = await getJson(`/api/luna/assemblies?project_id=${encodeURIComponent(projectId)}`);
      fillSelect(parentSelect, body.assemblies, 'None', (a) => `${a.partNumber} ${a.name}`);
      parentSelect.disabled = false;
    } catch (err) {
      log(err.message, 'error');
    }
  }

  // ---- Parts checklist -----------------------------------------------------
  // Parts marked COTS by hand, remembered per document in this browser.
  function cotsStoreKey() { return state.context ? `lunaCots:${state.context.documentId}` : 'lunaCots'; }
  function manualCotsSet() {
    try { return new Set(JSON.parse(localStorage.getItem(cotsStoreKey()) || '[]')); } catch (err) { return new Set(); }
  }
  function cotsKeyOf(part) { return part.stableKey || part.partId; }
  function applyManualCots() {
    const marked = manualCotsSet();
    for (const part of state.parts) {
      if (!marked.has(cotsKeyOf(part)) || part.group === 'hardware') continue;
      part.origGroup = part.group;
      part.group = 'hardware';
      part.manualCots = true;
      state.checked.delete(part.partId);
    }
  }
  function toggleCots(part) {
    const marked = manualCotsSet();
    const key = cotsKeyOf(part);
    if (part.manualCots) {
      marked.delete(key);
      part.group = part.origGroup || 'other';
      part.manualCots = false;
      log(`${part.name} is back in the main list.`);
    } else {
      marked.add(key);
      part.origGroup = part.group;
      part.group = 'hardware';
      part.manualCots = true;
      state.checked.delete(part.partId);
      log(`${part.name} moved to Hardware & COTS. Tap NOT COTS there to undo.`, 'success');
    }
    try { localStorage.setItem(cotsStoreKey(), JSON.stringify([...marked])); } catch (err) { /* storage blocked */ }
    peek.reset();
    renderPartList();
  }

  async function loadParts(refresh = false) {
    const started = Date.now();
    state.partsLoaded = false;
    el('partList').innerHTML = '<p class="chip-empty">Loading parts&hellip;</p>';
    try {
      const body = await getJson(`/api/onshape/parts${refresh ? '?refresh=1' : ''}`);
      state.parts = body.parts;
      applyManualCots();
      state.partsLoaded = true;
      state.partsLoadedAt = Date.now();
      state.partsError = '';
      state.kind = body.kind || 'partstudio';
      el('listLabel').textContent = state.kind === 'assembly' ? 'Parts in this assembly' : 'Parts in this Part Studio';
      // Forget ticks for parts that no longer exist.
      const ids = new Set(state.parts.map((p) => p.partId));
      for (const id of [...state.checked]) if (!ids.has(id)) state.checked.delete(id);
      if (!progressRestored) restoreProgress();
      renderPartList();
      mergeSameNamed();
      renderPartList();
      loadTwins();
      log(`${body.parts.length} parts loaded from this ${state.kind === 'assembly' ? 'assembly' : 'Part Studio'} in ${((Date.now() - started) / 1000).toFixed(1)}s.`);
    } catch (err) {
      // Kept, so a later redraw shows the reason instead of "Loading parts".
      state.partsError = err.message;
      renderPartList();
      log(err.message, 'error');
    }
  }

  function renderPartList() {
    try { peek.reset(); } catch (err) { /* not set up yet during start-up */ }
    const list = el('partList');
    // Something else (like the LUNA lookup) can finish first; keep saying
    // "Loading" until the parts themselves have arrived.
    if (!state.partsLoaded) {
      list.innerHTML = '<p class="chip-empty">Loading parts&hellip;</p>';
      if (state.partsError) list.firstChild.textContent = `Couldn\u2019t load parts. ${state.partsError}`;
      return;
    }
    list.innerHTML = '';
    if (!state.parts.length) {
      list.innerHTML = `<p class="chip-empty">No parts in this ${state.kind === 'assembly' ? 'assembly' : 'Part Studio'}.</p>`;
    }
    // Parts already in LUNA, and bolts/bearings/other bought parts, go under
    // closed folds at the bottom.
    const folds = {};
    const foldFor = (key, title, members) => {
      if (!members.length) return null;
      const fold = document.createElement('details');
      fold.className = 'hw-fold';
      fold.open = members.some((p) => state.checked.has(p.partId));
      const summary = document.createElement('summary');
      summary.textContent = `${title} (${members.length})`;
      fold.appendChild(summary);
      folds[key] = fold;
      return fold;
    };
    // Block CAD: bodies that came in through a Derive and have no team part
    // number, i.e. the robot's block model the real parts were built on.
    const section = (part) => {
      if (isUploaded(part)) return 'uploaded';
      if (part.group === 'hardware' || part.group === 'block') return part.group;
      return 'main';
    };
    foldFor('uploaded', 'ALREADY IN LUNA PARTS', state.parts.filter((p) => section(p) === 'uploaded'));
    foldFor('block', 'BLOCK CAD (DERIVED)', state.parts.filter((p) => section(p) === 'block'));
    foldFor('hardware', 'HARDWARE & COTS', state.parts.filter((p) => section(p) === 'hardware'));
    for (const part of state.parts) {
      const row = document.createElement('label');
      row.className = state.checked.has(part.partId) ? 'part-row on' : 'part-row';
      row.dataset.partId = part.partId;

      const box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = state.checked.has(part.partId);
      box.addEventListener('change', () => {
        if (box.checked) state.checked.add(part.partId);
        else state.checked.delete(part.partId);
        row.classList.toggle('on', box.checked);
        updateListFooter();
      });

      const text = document.createElement('span');
      text.className = 'part-text';
      const name = document.createElement('span');
      name.className = 'part-name';
      const lunaNumber = lunaNumberFor(part);
      name.textContent = lunaNumber || part.name;
      const sub = document.createElement('span');
      sub.className = 'part-sub';
      sub.textContent = lunaNumber ? `${part.name} \u00b7 ${part.material || 'No material'}` : (part.material || 'No material');
      if (part.quantity > 1) {
        const qty = document.createElement('span');
        qty.className = 'qty';
        qty.textContent = `\u00a0\u00b7\u00a0\u00d7${part.quantity}`;
        qty.title = part.mergedIds ? `${part.quantity} in total, counting same-shape twins with this number` : `${part.quantity} copies in the assembly`;
        sub.appendChild(qty);
      }
      text.append(name, sub);
      for (const twin of twinInfos(part)) {
        const line = document.createElement('span');
        const others = twin.others.map((p) => p.name).join(', ');
        if (twin.group.relation === 'mirror') {
          line.className = 'twin';
          line.textContent = `Mirror image of ${others}: a left/right pair, so it gets its own number`;
        } else if (twin.group.shares) {
          line.className = 'twin';
          line.textContent = `Same part as ${others}: gets the same number`;
        } else {
          line.className = 'twin ask';
          line.textContent = `Same size as ${others}, but too symmetric to check. Same part?`;
          const yes = document.createElement('button');
          yes.type = 'button';
          yes.textContent = 'SAME PART';
          yes.title = 'Give these the same part number';
          yes.addEventListener('click', (event) => {
            event.preventDefault();
            event.stopPropagation();
            confirmTwins(twin.group);
          });
          line.appendChild(yes);
        }
        text.appendChild(line);
      }

      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = state.faces.has(part.partId) ? 'FACE' : (part.linked ? 'LINKED' : 'PART');
      tag.title = state.faces.has(part.partId) ? 'The DXF will use the face you selected'
        : (part.linked ? 'Linked from another document (e.g. FRC Design App). Onshape won\'t rename it, so its team number is kept in LUNA Parts.' : '');

      // While naming, tapping a row numbers that part instead of ticking it.
      row.addEventListener('click', (event) => {
        if (!namer.active) return;
        event.preventDefault();
        namer.enqueueRow(part.partId);
      });

      const see = document.createElement('button');
      see.type = 'button';
      see.className = 'see';
      see.textContent = 'SEE';
      see.title = 'Show a picture of this part';
      see.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopPropagation();
        peek.toggle(part, row);
      });
      row.addEventListener('mouseenter', () => peek.hoverStart(part, row));
      row.addEventListener('mouseleave', () => peek.hoverEnd());

      // COTS: move a part into the Hardware & COTS fold by hand (and back).
      let cots = null;
      if (part.manualCots || (!isUploaded(part) && part.group !== 'hardware' && part.group !== 'block')) {
        cots = document.createElement('button');
        cots.type = 'button';
        cots.className = 'see';
        cots.textContent = part.manualCots ? 'NOT COTS' : 'COTS';
        cots.title = part.manualCots
          ? 'Put this part back in the main list'
          : 'Bought part: move it to Hardware & COTS so it stops showing up';
        cots.addEventListener('click', (event) => {
          event.preventDefault();
          event.stopPropagation();
          toggleCots(part);
        });
      }

      row.append(box, text, see, ...(cots ? [cots] : []), tag);
      (folds[section(part)] || list).appendChild(row);
    }
    if (folds.uploaded) list.appendChild(folds.uploaded);
    if (folds.block) list.appendChild(folds.block);
    if (folds.hardware) list.appendChild(folds.hardware);
    updateListFooter();
  }

  function updateListFooter() {
    const n = state.checked.size;
    el('checkedCount').textContent = `${n} part${n === 1 ? '' : 's'} selected`;
    // A project is only needed for ticked parts whose number doesn't pick one.
    const needsProject = state.parts.some((p) => state.checked.has(p.partId) && !autoProject(p.name));
    const missing = needsProject && !projectSelect.value;
    el('startBtn').disabled = n === 0 || missing || !statusSelect.value;
    if (state.screen === 'list') {
      showHint(n && missing ? 'Pick a project first.' : '');
    }
    saveProgress();
  }

  // ---- Smart defaults (from the team's manufacturing manual) ---------------
  // Each LUNA project is one subsystem. A part number like 26O-E001 picks the
  // project whose part-number prefix it starts with, or else the project
  // whose name starts with the subsystem letters (E -> Elevator).
  function autoProject(partName) {
    const name = String(partName || '').trim().toUpperCase();
    const projects = state.projects || [];
    if (!name) return null;
    const byPrefix = projects
      .filter((p) => p.prefix && name.startsWith(String(p.prefix).toUpperCase()))
      .sort((a, b) => String(b.prefix).length - String(a.prefix).length)[0];
    if (byPrefix) return { project: byPrefix, why: `prefix ${byPrefix.prefix}` };
    const m = name.match(/^\d{2}[A-Z]{1,3}-([A-Z]{1,4})\d/);
    if (!m) return null;
    const matches = projects.filter((p) => String(p.name).toUpperCase().startsWith(m[1]));
    return matches.length === 1 ? { project: matches[0], why: `${m[1]} in ${name.split(/\s/)[0]}` } : null;
  }

  // The machine the part most likely starts on, from its material and shape.
  // Returns { tool, why } or null; the user can always change it.
  const MACHINE_RULES = [
    { test: (p, m) => /srpp|polypropylene/.test(m), tools: [/router/, /cnc|mill/], why: 'SRPP is routed' },
    { test: (p, m) => /pa6|nylon|pla\b|pla\+|petg|onyx|tpu|print/.test(m), tools: [/print|3d/], why: '3D-printed material' },
    { test: (p) => p.shape === 'shaft', tools: [/lathe/], why: 'long and round/hex, like a shaft' },
    { test: (p) => p.group === 'stock' || /shaft|spacer|round tube/i.test(p.name), tools: [/lathe/], why: 'shaft or spacer' },
    { test: (p, m) => /alum|6061|7075|polycarb|lexan|delrin|acetal|hdpe|uhmw|carbon/.test(m), tools: [/cnc|mill/, /router/], why: 'plate material' },
  ];

  function guessTool(part) {
    const material = String(part.material || '').toLowerCase();
    const tools = state.tools || [];
    for (const rule of MACHINE_RULES) {
      if (!rule.test(part, material)) continue;
      for (const re of rule.tools) {
        const tool = tools.find((t) => re.test(String(t.name).toLowerCase()) && !(re.source !== 'lathe' && /lathe/i.test(t.name)));
        if (tool) return { tool, why: rule.why };
      }
      return null;
    }
    return null;
  }

  // ---- Onshape selections -> "Use Selection" banner ------------------------
  // Onshape tells an embedded panel what the user clicked via postMessage,
  // but only after the panel introduces itself with 'applicationInit'.
  // A click on a face/edge/vertex in the 3D view arrives as that entity's
  // ID; the server works out which part owns it.
  const ONSHAPE_ORIGIN = 'https://cad.onshape.com';
  let lookupCounter = 0;
  let lastSelectionIds = new Set();

  function listenForSelections(context) {
    window.addEventListener('message', (event) => {
      if (event.origin !== ONSHAPE_ORIGIN || !event.data) return;
      if (event.data.messageName !== 'SELECTION') return;

      const selections = event.data.selections || [];
      // Onshape sends the whole selection each time, so work out which
      // entities were just added (for the namer, one part per click).
      const ids = selections.map((s) => s.selectionId).filter(Boolean);
      const added = selections.filter((s) => s.selectionId && !lastSelectionIds.has(s.selectionId));
      lastSelectionIds = new Set(ids);
      state.currentSelections = selections;
      if (namer.active) {
        // Each part clicked in the 3D view gets the next number, in click
        // order. In an assembly the click is matched to its row first.
        for (const s of added) {
          if (state.kind !== 'assembly') { namer.enqueue(s.selectionId); continue; }
          const part = partForSelection(s);
          if (part) namer.enqueueRow(part.partId);
        }
        return;
      }
      if (added.length) findRowForSelection(added);
      const picked = selections.find((s) => s.selectionId);
      if (picked) {
        lookUpSelection(picked);
      } else if (!selections.length) {
        state.pendingSelection = null;
        updateBanner();
      }
    });

    window.parent.postMessage({
      documentId: context.documentId,
      workspaceId: context.workspaceId,
      elementId: context.elementId,
      messageName: 'applicationInit',
    }, ONSHAPE_ORIGIN);
    log('Listening for part selections in Onshape.');
  }

  async function lookUpSelection(selection) {
    // Clicks can arrive faster than lookups finish; only the latest one wins.
    // Assembly clicks aren't Part Studio faces; parts are ticked from the list.
    if (state.kind === 'assembly') return;
    const lookup = ++lookupCounter;
    log(`Selected ${(selection.entityType || 'entity').toLowerCase()} ${selection.selectionId}&hellip;`);
    try {
      const body = await getJson(`/api/onshape/selected-part?selectionId=${encodeURIComponent(selection.selectionId)}`);
      if (lookup !== lookupCounter) return;

      // While stepping through parts, a click on the current part's face
      // just picks that face for its DXF.
      if (state.screen === 'card' && body.partId === currentPartId() && body.faceId) {
        state.faces.set(body.partId, { faceId: body.faceId, flatFace: body.flatFace });
        updateAttachHint();
        log(`Face picked for ${body.name}'s DXF.`, 'success');
        return;
      }
      state.pendingSelection = body;
      updateBanner();
    } catch (err) {
      if (lookup === lookupCounter) log(err.message, 'error');
    }
  }

  function updateBanner() {
    const sel = state.pendingSelection;
    const show = Boolean(sel) && state.screen === 'list';
    el('selBanner').hidden = !show;
    if (show) {
      const already = state.checked.has(sel.partId);
      el('selText').textContent = already ? `${sel.name} is ticked` : `${sel.name} selected in Onshape`;
      el('useSelBtn').hidden = already && !sel.faceId;
    }
  }

  function useSelection() {
    const sel = state.pendingSelection;
    if (!sel) return;
    state.checked.add(sel.partId);
    if (sel.faceId) state.faces.set(sel.partId, { faceId: sel.faceId, flatFace: sel.flatFace });
    state.pendingSelection = null;
    renderPartList();
    updateBanner();
    const row = document.querySelector(`.part-row[data-part-id="${CSS.escape(sel.partId)}"]`);
    if (row) row.scrollIntoView({ block: 'nearest' });
    log(`Ticked ${sel.name}${sel.faceId ? ' (with the clicked face for its DXF)' : ''}.`, 'success');
  }

  // ---- Which part is which -------------------------------------------------
  // Hovering a row (or tapping SEE) shows a picture of the part and its size.
  // Onshape won't let an app highlight a part inside an assembly, so this is
  // the safe way to tell rows like "Shaft" apart.
  const peek = {
    box: null,
    pinned: null,
    timer: null,
    shown: null,
    ensureBox() {
      if (this.box) return this.box;
      this.box = document.createElement('div');
      this.box.className = 'peek';
      this.box.hidden = true;
      this.box.innerHTML = '<img alt=""><div class="peek-name"></div><div class="peek-sub"></div>';
      document.body.appendChild(this.box);
      return this.box;
    },
    async show(part, row) {
      const box = this.ensureBox();
      this.shown = part.partId;
      const img = box.querySelector('img');
      img.src = pictures.get(part.partId) || `/api/onshape/part-image?partId=${encodeURIComponent(part.partId)}`;
      img.alt = part.name;
      box.querySelector('.peek-name').textContent = lunaNumberFor(part) || part.name;
      const sub = box.querySelector('.peek-sub');
      sub.textContent = [part.material, part.quantity > 1 ? `\u00d7${part.quantity}` : ''].filter(Boolean).join(' \u00b7 ') || ' ';
      const rect = row.getBoundingClientRect();
      const top = rect.bottom + 230 < window.innerHeight ? rect.bottom + 4 : Math.max(4, rect.top - 234);
      box.style.top = `${top}px`;
      box.style.left = `${Math.max(4, Math.min(window.innerWidth - 194, rect.right - 194))}px`;
      box.hidden = false;
      if (!part.dims) {
        try {
          const body = await getJson(`/api/onshape/part-shape?partId=${encodeURIComponent(part.partId)}`);
          part.dims = body.dims;
          if (part.shape === undefined) { part.shape = body.shape; part.thickness = body.thickness; }
        } catch (err) { part.dims = null; }
      }
      if (this.shown === part.partId && part.dims) {
        const size = part.dims.map((d) => d.toFixed(2)).join(' \u00d7 ');
        sub.textContent = [`${size} in`, sub.textContent.trim()].filter(Boolean).join(' \u00b7 ');
      }
    },
    hide() {
      if (this.box) this.box.hidden = true;
      this.shown = null;
      document.querySelectorAll('.see.on').forEach((b) => b.classList.remove('on'));
    },
    toggle(part, row) {
      clearTimeout(this.timer);
      if (this.pinned === part.partId) { this.pinned = null; this.hide(); return; }
      this.hide();
      this.pinned = part.partId;
      row.querySelector('.see').classList.add('on');
      this.show(part, row);
    },
    hoverStart(part, row) {
      if (this.pinned) return;
      clearTimeout(this.timer);
      this.timer = setTimeout(() => this.show(part, row), pictures.has(part.partId) ? 150 : 350);
    },
    hoverEnd() {
      clearTimeout(this.timer);
      if (!this.pinned) this.hide();
    },
    reset() { this.pinned = null; clearTimeout(this.timer); this.hide(); },
  };

  // Pictures shown so far (fetched on hover or SEE, not for every part up
  // front, since Onshape caps how many API calls the app gets a year).
  const pictures = new Map(); // partId -> object URL

  // Clicking a part in the assembly's 3D view finds its row: opens its fold,
  // scrolls to it and lights it up, and shows its picture.
  // The assembly part a 3D-view click (OCCURRENCE selection) belongs to.
  function partForSelection(sel) {
    const path = (sel.occurrencePath || []).join('/');
    return state.parts.find((p) => (p.occurrences || []).some((occ) => (path && occ.join('/') === path)
      || occ[occ.length - 1] === sel.selectionId)) || null;
  }

  function findRowForSelection(selections) {
    if (state.kind !== 'assembly' || state.screen !== 'list') return;
    for (const sel of [...selections].reverse()) {
      const part = partForSelection(sel);
      if (!part) continue;
      const row = document.querySelector(`.part-row[data-part-id="${CSS.escape(part.partId)}"]`);
      if (!row) return;
      const fold = row.closest('details');
      if (fold) fold.open = true;
      row.scrollIntoView({ block: 'center', behavior: 'smooth' });
      document.querySelectorAll('.part-row.found').forEach((r) => r.classList.remove('found'));
      row.classList.add('found');
      setTimeout(() => row.classList.remove('found'), 2500);
      peek.reset();
      setTimeout(() => peek.toggle(part, row), 400);
      return;
    }
  }

  // ---- Twins: different bodies with the same shape ----------------------
  // The server finds parts of the same size, then lines them up point by
  // point. Copies (and mirrors of symmetric parts) share a number
  // automatically; true left/right mirror pairs keep separate numbers; parts
  // too symmetric to line up wait for a SAME PART tap, remembered per
  // document.
  const TEAM_NAME = /^(\d{2}[a-z]{1,3}-[a-z]{1,4}\d{1,4}|\d{2}-[a-z]{1,4}-\d{1,4}|[a-z]{1,3}-?\d{1,4})\b/i;
  state.twinGroups = [];
  function twinsKey() { return state.context ? `lunaTwins:${state.context.documentId}` : 'lunaTwins'; }
  function confirmedTwins() {
    try { return new Set(JSON.parse(localStorage.getItem(twinsKey()) || '[]')); } catch (err) { return new Set(); }
  }
  function groupKey(ids) { return [...ids].sort().join('+'); }
  function twinInfos(part) {
    const ids = [part.partId, ...(part.mergedIds || [])];
    const out = [];
    for (const group of state.twinGroups) {
      if (!group.ids.some((id) => ids.includes(id))) continue;
      const others = state.parts.filter((p) => p !== part && group.ids.some((id) => id === p.partId || (p.mergedIds || []).includes(id)));
      if (others.length) out.push({ group, others });
    }
    return out;
  }
  // The name a part should get if a sharing twin is already numbered.
  // `ignore` skips twins whose current name is about to be replaced.
  function twinNumber(partId, series, ignore = () => false) {
    const group = state.twinGroups.find((g) => g.shares && g.ids.includes(partId));
    if (!group) return null;
    const named = state.parts.find((p) => p.partId !== partId && !ignore(p)
      && [p.partId, ...(p.mergedIds || [])].some((id) => group.ids.includes(id)) && series.test(p.name));
    return named ? named.name : null;
  }
  // How many new numbers naming these parts uses: a twin of a part that is
  // already numbered (or of one earlier in the list) reuses that number.
  function newNumbersFor(partIds, series, ignore) {
    const used = new Set();
    let count = 0;
    for (const partId of partIds) {
      const group = partId && state.twinGroups.find((g) => g.shares && g.ids.includes(partId));
      if (group && (used.has(group) || twinNumber(partId, series, ignore))) continue;
      if (group) used.add(group);
      count += 1;
    }
    return count;
  }
  function confirmTwins(group) {
    const confirmed = confirmedTwins();
    confirmed.add(groupKey(group.ids));
    try { localStorage.setItem(twinsKey(), JSON.stringify([...confirmed])); } catch (err) { /* storage blocked */ }
    group.shares = true;
    log(`Marked as the same part: ${state.parts.filter((p) => group.ids.includes(p.partId)).map((p) => p.name).join(', ')}.`, 'success');
    renderPartList();
    if (namer.active) namer.render();
  }
  async function loadTwins() {
    const candidates = state.parts.filter((p) => !p.linked && p.group !== 'hardware' && p.group !== 'block');
    if (candidates.length < 2) return;
    try {
      const body = await getJson('/api/onshape/twins', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ partIds: candidates.flatMap((p) => [p.partId, ...(p.mergedIds || [])]) }),
      });
      const confirmed = confirmedTwins();
      state.twinGroups = body.groups.map((g) => ({
        ids: g.ids,
        relation: g.relation,
        shares: g.relation === 'same' || (g.relation === 'unknown' && confirmed.has(groupKey(g.ids))),
      }));
      if (state.twinGroups.length) {
        const count = (r) => state.twinGroups.filter((g) => g.relation === r).length;
        const bits = [
          count('same') ? `${count('same')} set${count('same') === 1 ? '' : 's'} of copies (they share a number)` : '',
          count('mirror') ? `${count('mirror')} left/right mirror pair${count('mirror') === 1 ? '' : 's'} (own numbers)` : '',
          count('unknown') ? `${count('unknown')} to check by hand` : '',
        ].filter(Boolean);
        log(`Same-shape check: ${bits.join(', ')}.`);
        if (state.screen === 'list') renderPartList();
        if (namer.active) namer.render();
      }
    } catch (err) {
      log(`Couldn't check for same-shape parts: ${err.message}`, 'error');
    }
  }
  // Rows with the same team number are one part in LUNA: show them as one
  // row with the quantities added up.
  function mergeSameNamed() {
    const byName = new Map();
    const keep = [];
    for (const part of state.parts) {
      const key = String(part.name || '').trim().toUpperCase();
      const first = !part.linked && TEAM_NAME.test(key) ? byName.get(key) : null;
      if (!first) {
        if (!part.linked && TEAM_NAME.test(key)) byName.set(key, part);
        keep.push(part);
        continue;
      }
      first.mergedIds = [...(first.mergedIds || []), part.partId, ...(part.mergedIds || [])];
      first.quantity = (first.quantity || 1) + (part.quantity || 1);
      first.occurrences = [...(first.occurrences || []), ...(part.occurrences || [])];
      if (state.checked.has(part.partId)) { state.checked.delete(part.partId); state.checked.add(first.partId); }
    }
    state.parts = keep;
  }

  function escapeRegExp(text) {
    return String(text).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  // ---- Part namer ----------------------------------------------------------
  // Press NAME, set the prefix (26O-E), then click parts in Onshape: each
  // new part clicked is renamed to the next number (26O-E001, 26O-E002...).
  const namer = {
    active: false,
    next: null,
    named: [],          // [{ partId, oldName, newName }] for Undo
    chain: Promise.resolve(),
    prefixKey() { return state.context ? `lunaPrefix:${state.context.documentId}` : 'lunaPrefix'; },
    prefix() { return el('namerPrefix').value.trim().toUpperCase(); },
    format(n, prefix = this.prefix()) { return `${prefix}${String(n).padStart(3, '0')}`; },
    // The prefix last used for this document, even when NAME isn't open.
    savedPrefix() {
      let saved = '';
      try { saved = localStorage.getItem(this.prefixKey()) || ''; } catch (err) { /* storage blocked */ }
      return (saved || this.prefix() || '26O-E').toUpperCase();
    },
    message(text, kind = '') {
      const msg = el('namerMsg');
      msg.className = `namer-msg ${kind}`;
      msg.textContent = text;
    },
    render() {
      el('namerNext').textContent = this.next ? this.format(this.next) : '…';
      el('namerUndo').disabled = !this.named.length;
      if (this.finishing) return;
      const todo = this.todo();
      const n = todo.length;
      const fresh = newNumbersFor(todo.map((item) => item.partId), this.series(), (p) => this.stale(p));
      el('namerDone').textContent = n ? `NAME ${n} & DONE` : 'DONE';
      if (n && this.next) {
        const last = this.format(this.next + Math.max(fresh, 1) - 1);
        const how = this.pendingSource === 'ticked' ? 'ticked in the list' : 'selected in Onshape';
        const order = this.pendingSource === 'ticked' ? 'in list order' : 'in the order you selected them';
        const notes = [
          this.skippedLinked ? `${this.skippedLinked} linked FRC Design App part${this.skippedLinked === 1 ? '' : 's'} left out (they get their number on the upload card)` : '',
          this.pending.length > n ? `${this.pending.length - n} already numbered ${this.prefix()}… and left as they are` : '',
          this.startOver && this.alreadyInSeries ? `starting over: ${this.alreadyInSeries === 1 ? '1 part that already had' : `${this.alreadyInSeries} parts that already had`} a ${this.prefix()} number ${this.alreadyInSeries === 1 ? 'gets' : 'get'} a new one too, because most of the ticked parts use a different name type` : '',
          this.next > 1 && this.lunaHighest >= this.next - 1 ? `${this.format(1)} to ${this.format(this.next - 1)} are already used in this LUNA project` : '',
          n > fresh ? `${n - fresh} same-shape twin${n - fresh === 1 ? '' : 's'} share${n - fresh === 1 ? 's' : ''} a number with ${n - fresh === 1 ? 'its' : 'their'} match` : '',
        ].filter(Boolean);
        const range = fresh > 1 ? ` to ${last}, ${order}` : '';
        this.message(`${n} part${n === 1 ? ' is' : 's are'} ${how}. Press NAME ${n} & DONE to number ${n === 1 ? 'it' : 'them'} ${fresh ? this.format(this.next) : 'with their twins\u2019 numbers'}${fresh ? range : ''}.${notes.length ? ` (${notes.join('; ')}.)` : ''}`);
      } else if (!n && this.pending.length && this.next) {
        this.message(`The ${this.pendingSource === 'ticked' ? 'ticked' : 'selected'} parts already have ${this.prefix()} numbers. Click parts in Onshape (or tap them below) to number more.`);
      }
    },
    // Pending parts that still need a number in the current series (a part
    // already called e.g. 26O-E001 isn't renumbered when the prefix is 26O-E).
    todo() {
      const series = this.series();
      return this.pending.filter((item) => {
        if (!item.partId) return true;
        const part = state.parts.find((p) => p.partId === item.partId);
        if (!part) return false;
        if (this.startOver) return !this.named.some((n) => n.partId === item.partId);
        return !series.test(part.name);
      });
    },
    // A new name type: when most ticked parts don't use this prefix yet,
    // every ticked part is renumbered from the start (Micah, 2026-11-02).
    // When most already do, numbering carries on and they're left alone.
    get startOver() {
      const ids = this.pending.filter((item) => item.partId).map((item) => item.partId);
      return ids.length > 0 && this.alreadyInSeries * 2 < ids.length;
    },
    get alreadyInSeries() {
      const series = this.series();
      return this.pending.filter((item) => {
        const part = item.partId && state.parts.find((p) => p.partId === item.partId);
        return part && series.test(part.name);
      }).length;
    },
    // A ticked part's old number doesn't count while it's being renumbered.
    stale(part) {
      return this.startOver && this.pending.some((item) => item.partId === part.partId)
        && !this.named.some((n) => n.partId === part.partId);
    },
    lunaHighest: 0,
    pendingSource: '',
    finishing: false,
    pending: [],  // parts already selected when NAME was opened
    skippedLinked: 0,
    // What was selected in Onshape before NAME opened, as parts to name on DONE.
    pendingFromSelection() {
      const sels = (state.currentSelections || []).filter((x) => x.selectionId);
      this.skippedLinked = 0;
      this.pendingSource = 'selection';
      if (sels.length && state.kind !== 'assembly') return sels.map((x) => ({ selectionId: x.selectionId }));
      let parts = [];
      const seen = new Set();
      for (const sel of sels) {
        const part = partForSelection(sel);
        if (part && !seen.has(part.partId)) { seen.add(part.partId); parts.push(part); }
      }
      // Nothing selected in Onshape: use the parts ticked in the list, in
      // list order.
      if (!parts.length && state.checked.size) {
        this.pendingSource = 'ticked';
        parts = state.parts.filter((p) => state.checked.has(p.partId));
      }
      const out = [];
      for (const part of parts) {
        if (part.linked) this.skippedLinked += 1;
        else out.push({ partId: part.partId });
      }
      return out;
    },
    async finish() {
      if (this.pending.length) {
        if (!this.next) await this.loadNext();
        if (!this.next) return; // prefix problem; the message says why
        const todo = this.todo();
        this.finishing = true;
        el('namerDone').disabled = true;
        let done = 0;
        for (const item of todo) {
          const step = () => {
            done += 1;
            el('namerDone').textContent = `NAMING ${done}/${todo.length}…`;
          };
          this.chain = this.chain.then(step);
          if (item.partId) this.enqueueRow(item.partId);
          else this.enqueue(item.selectionId);
        }
        await this.chain;
        this.pending = [];
        this.finishing = false;
        mergeSameNamed();
        renderPartList();
        el('namerDone').disabled = false;
      }
      this.close();
    },
    async open() {
      this.active = true;
      this.named = [];
      try {
        const saved = localStorage.getItem(this.prefixKey());
        if (saved) el('namerPrefix').value = saved;
      } catch (err) { /* storage blocked */ }
      el('namer').hidden = false;
      el('nameBtn').classList.add('on');
      state.pendingSelection = null;
      updateBanner();
      this.message('Click each part in Onshape (or tap it in the list), in the order you want them numbered.');
      this.pending = this.pendingFromSelection();
      await this.loadNext();
    },
    close() {
      this.active = false;
      this.pending = [];
      el('namerDone').textContent = 'DONE';
      el('namer').hidden = true;
      el('nameBtn').classList.remove('on');
      if (this.named.length) log(`Named ${this.named.length} part${this.named.length === 1 ? '' : 's'}.`, 'success');
    },
    async loadNext() {
      const prefix = this.prefix();
      this.next = null;
      this.render();
      if (!/^[A-Z0-9][A-Z0-9-]{0,15}$/.test(prefix)) {
        this.message('Use letters, numbers and dashes for the prefix, like 26O-E.', 'bad');
        return;
      }
      try {
        const query = new URLSearchParams({ prefix });
        if (projectSelect.value) query.set('project_id', projectSelect.value);
        if (this.startOver) query.set('exclude', this.pending.map((item) => item.partId).filter(Boolean).join(','));
        const body = await getJson(`/api/onshape/next-number?${query}`);
        if (prefix !== this.prefix()) return; // typed again meanwhile
        this.next = body.next;
        this.lunaHighest = body.lunaHighest || 0;
        try { localStorage.setItem(this.prefixKey(), prefix); } catch (err) { /* storage blocked */ }
        this.render();
      } catch (err) {
        this.message(err.message, 'bad');
      }
    },
    // Clicks are handled one at a time so the numbers stay in click order.
    enqueue(selectionId) {
      this.chain = this.chain.then(() => this.nameSelection(selectionId)).catch(() => {});
    },
    enqueueRow(partId) {
      this.chain = this.chain.then(() => this.nameRow(partId)).catch(() => {});
    },
    async nameRow(partId) {
      if (!this.active || !this.next) return;
      const part = state.parts.find((p) => p.partId === partId);
      if (!part || this.named.some((n) => n.partId === partId)) return;
      if (part.linked) {
        this.linkedMessage(part);
        return;
      }
      const shared = twinNumber(partId, this.series(), (p) => this.stale(p));
      if (shared) { await this.rename(part.partId, shared, part.name, { keepNext: true }); return; }
      const newName = this.format(this.next);
      if (part.name === newName) { this.next += 1; this.render(); return; }
      await this.rename(part.partId, newName, part.name);
    },
    linkedMessage(part) {
      this.message(`${part.name} is linked from another document (like FRC Design App), so Onshape won't let it be renamed. It gets its team number on its upload card instead, and the panel shows that number from then on.`, 'bad');
    },
    async nameSelection(selectionId) {
      if (!this.active || !this.next) return;
      let part;
      try {
        part = await getJson(`/api/onshape/selected-part?selectionId=${encodeURIComponent(selectionId)}`);
      } catch (err) {
        this.message(err.message, 'bad');
        return;
      }
      if (this.named.some((n) => n.partId === part.partId)) return; // another face of a part already named
      const shared = twinNumber(part.partId, this.series(), (p) => this.stale(p));
      if (shared) { await this.rename(part.partId, shared, part.name, { keepNext: true }); return; }
      const newName = this.format(this.next);
      if (part.name === newName) { this.next += 1; this.render(); return; }
      await this.rename(part.partId, newName, part.name);
    },
    series() { return new RegExp(`^${escapeRegExp(this.prefix())}\\d+\\b`, 'i'); },
    async rename(partId, newName, oldName, { undo = false, keepNext = false } = {}) {
      try {
        await getJson('/api/onshape/rename', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ partId, name: newName }),
        });
      } catch (err) {
        const part = state.parts.find((p) => p.partId === partId);
        if (err.body && err.body.linked && part) {
          part.linked = true;
          this.linkedMessage(part);
          renderPartList();
          return false;
        }
        const msg = el('namerMsg');
        this.message(err.message, 'bad');
        if (err.body && err.body.needsWrite && state.context) {
          const c = state.context;
          const link = document.createElement('a');
          link.href = `/oauth/login?force=1&documentId=${c.documentId}&workspaceId=${c.workspaceId}&elementId=${c.elementId}`;
          link.textContent = ' Reconnect to Onshape';
          msg.appendChild(link);
        }
        return false;
      }
      const listed = state.parts.find((p) => p.partId === partId);
      // A row can stand for several same-shape parts: rename them all.
      for (const id of (listed && listed.mergedIds) || []) {
        try {
          await getJson('/api/onshape/rename', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ partId: id, name: newName }),
          });
        } catch (err) {
          log(`Couldn't rename a twin of ${oldName}: ${err.message}`, 'error');
        }
      }
      if (listed) listed.name = newName;
      if (undo) {
        if (!keepNext) this.next -= 1;
        this.message(`Put back ${newName}.`);
      } else {
        this.named.push({ partId, oldName, newName, keepNext });
        if (!keepNext) this.next += 1;
        this.message(`${oldName} \u2192 ${newName}${keepNext ? ' (same shape as a part already numbered)' : ''}`);
        showToast(`\u2713 Named ${newName}`);
      }
      this.render();
      if (!undo && !this.finishing) mergeSameNamed(); // a batch merges once at the end
      renderPartList();
      return true;
    },
    async undo() {
      const last = this.named.pop();
      if (!last) return;
      this.render();
      const ok = await this.rename(last.partId, last.oldName, last.newName, { undo: true, keepNext: last.keepNext });
      if (!ok) this.named.push(last);
      this.render();
    },
  };

  let prefixTimer = null;
  el('namerPrefix').addEventListener('input', () => {
    clearTimeout(prefixTimer);
    prefixTimer = setTimeout(() => namer.loadNext(), 400);
  });
  el('nameBtn').addEventListener('click', () => (namer.active ? namer.close() : namer.open()));
  el('namerDone').addEventListener('click', () => namer.finish());
  el('namerUndo').addEventListener('click', () => { namer.chain = namer.chain.then(() => namer.undo()); });

  // ---- Saved progress --------------------------------------------------------
  // Onshape reloads the panel when you switch to another tab and back, which
  // used to lose the ticks and the card you were on. They're saved in this
  // browser for each tab (document + Part Studio or assembly) and put back
  // when the panel opens again. Uploads that were still running when the
  // panel closed can't be finished, so they show as STOPPED.
  var PROGRESS_MAX_AGE_MS = 12 * 60 * 60 * 1000;
  var DRAFT_FIELDS = ['cardProjectSelect', 'nameInput', 'partNumberInput', 'statusSelect', 'typeSelect',
    'quantityInput', 'toolSelect', 'prioritySelect', 'parentSelect', 'materialInput', 'thicknessSelect',
    'cutLengthInput', 'leadTimeInput', 'descriptionInput', 'drawingSelect'];
  var progressRestored = false; // nothing is saved until the old save has been read
  var restoringCard = false;
  var markLunaReady;
  var lunaReady = new Promise((resolve) => { markLunaReady = resolve; });

  function progressKey() {
    const c = state.context;
    return c ? `lunaProgress:${c.documentId}:${c.elementId}` : '';
  }

  function cardDraft() {
    if (state.screen !== 'card' || !currentPartId()) return null;
    const values = {};
    for (const id of DRAFT_FIELDS) values[id] = el(id).value;
    return { partId: currentPartId(), values, step: el('stepInput').checked };
  }

  function saveProgress() {
    const key = progressKey();
    if (!key || !progressRestored || restoringCard) return;
    const data = {
      savedAt: Date.now(),
      screen: state.screen,
      checked: [...state.checked],
      queue: state.queue,
      current: currentPartId() || null,
      results: state.results.map(({ name, outcome, detail, kind }) => ({ name, outcome, detail, kind })),
      draft: cardDraft(),
    };
    try { localStorage.setItem(key, JSON.stringify(data)); } catch (err) { /* storage blocked or full */ }
  }

  function readProgress() {
    try {
      const data = JSON.parse(localStorage.getItem(progressKey()) || 'null');
      return data && Date.now() - data.savedAt < PROGRESS_MAX_AGE_MS ? data : null;
    } catch (err) {
      return null;
    }
  }

  // Runs once, when the parts list first arrives.
  function restoreProgress() {
    const data = readProgress();
    progressRestored = true;
    if (!data) return;
    const ids = new Set(state.parts.map((p) => p.partId));
    for (const id of data.checked || []) if (ids.has(id)) state.checked.add(id);
    state.results = (data.results || []).map((r) => (r.outcome === 'pending'
      ? { ...r, outcome: 'stopped', kind: 'bad', detail: 'Stopped when the panel closed. Check LUNA Parts before uploading it again.' }
      : r));
    const queue = (data.queue || []).filter((id) => ids.has(id));
    const step = queue.indexOf(data.current);
    const stopped = state.results.filter((r) => r.outcome === 'stopped').length;
    if (stopped) log(`${stopped} upload${stopped === 1 ? ' was' : 's were'} still running when the panel closed. Check ${stopped === 1 ? 'it' : 'them'} in LUNA Parts.`, 'error');
    if (state.checked.size) log(`Put back ${state.checked.size} ticked part${state.checked.size === 1 ? '' : 's'} from before.`);
    if (data.screen === 'card' && step >= 0) {
      state.queue = queue;
      state.step = step;
      // The card's lists (projects, statuses, machines) come from LUNA.
      restoringCard = true;
      lunaReady.then(() => {
        restoringCard = false;
        if (state.screen !== 'list' || currentPartId() !== data.current) return;
        showScreen('card');
        loadCard();
        const draft = data.draft;
        if (draft && draft.partId === data.current) {
          for (const id of DRAFT_FIELDS) if (draft.values[id] !== undefined) el(id).value = draft.values[id];
          el('stepInput').checked = Boolean(draft.step);
          updateAttachHint();
        }
        log(`Back on part ${state.step + 1} of ${state.queue.length}.`);
        saveProgress();
      });
    } else if (data.screen === 'done' && state.results.length) {
      setTimeout(showDone, 0);
    }
  }

  el('partForm').addEventListener('input', saveProgress);
  el('partForm').addEventListener('change', saveProgress);

  // ---- Stepping through the ticked parts -----------------------------------
  function currentPartId() {
    return state.queue[state.step];
  }

  function currentPart() {
    return state.parts.find((p) => p.partId === currentPartId());
  }

  // Part numbers already in LUNA (any project), for the "Already in LUNA" fold.
  // Linked parts (FRC Design App shafts, spacers) keep their catalog name in
  // Onshape; their team number is found in LUNA by the tag in its notes.
  function lunaNumberFor(part) {
    return (part.onshapeKey && state.linkedNumbers && state.linkedNumbers.get(part.onshapeKey)) || '';
  }

  function isUploaded(part) {
    if (lunaNumberFor(part)) return true;
    return Boolean(state.uploaded && state.uploaded.has(String(part.name || '').trim().toUpperCase()));
  }

  // Next free team number for a linked part's card. Numbers handed out in
  // this batch are skipped, since their uploads may not have finished yet.
  const givenNumbers = new Set();
  async function nextNumberForLinked(projectId) {
