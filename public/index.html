<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Parts Tracker Bridge</title>

<!-- Condensed headings like a shop-floor board; plain sans for fields. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="icon" href="/icon.png" />

<style>
  /* Navy and gold, with pill "chips" instead of dropdowns, sized for
     Onshape's ~300px right panel. */
  :root {
    --bg: #1f2b5c;
    --card: #16204a;
    --field: #111a3d;
    --line: #2e3c74;
    --text: #eef1fa;
    --muted: #9aa5cc;
    --gold: #e9b44c;
    --gold-ink: #1a1f3a;
    --good: #4ade80;
    --bad: #f87171;
    --pending: #fbbf24;
    --heading: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', ui-sans-serif, system-ui, sans-serif;
    font-size: 13px;
  }

  .panel { padding: 0 10px 84px; }

  /* ---- Header + tabs ---- */
  .top {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 0 8px;
    border-bottom: 2px solid var(--gold);
  }
  .top img { width: 30px; height: 30px; flex-shrink: 0; }
  .brand { font-family: var(--heading); font-weight: 700; font-size: 17px; letter-spacing: 0.04em; line-height: 1; }
  .sub { font-family: var(--heading); font-weight: 500; font-size: 11px; letter-spacing: 0.12em; color: var(--gold); margin-top: 2px; }
  .doc { margin-left: auto; text-align: right; font-size: 10px; color: var(--muted); line-height: 1.3; }

  .tabs { display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--line); }
  .tab {
    font-family: var(--heading); font-weight: 600; font-size: 14px; letter-spacing: 0.08em;
    color: var(--muted); background: none; border: none; padding: 8px 0 6px;
    border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--gold); }
  .tab:disabled { cursor: default; opacity: 0.5; }
  .tab-link {
    margin-left: auto; font-family: var(--heading); font-weight: 600; font-size: 12px;
    letter-spacing: 0.08em; color: var(--gold); text-decoration: none;
  }

  .status { display: flex; align-items: center; gap: 6px; margin: 8px 0; font-size: 11.5px; color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pending); flex-shrink: 0; }
  .status.good .dot { background: var(--good); }
  .status.bad .dot { background: var(--bad); }
  .status.bad { color: var(--bad); }

  /* ---- Form ---- */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 11px 8px;
  }

  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field.full { grid-column: 1 / -1; }

  label {
    font-family: var(--heading); font-weight: 600; font-size: 11.5px;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
  }
  .req { color: var(--gold); margin-left: 2px; }

  input, select, textarea {
    width: 100%;
    font: inherit;
    font-size: 12.5px;
    color: var(--text);
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 6px 8px;
    outline: none;
  }
  input::placeholder, textarea::placeholder { color: #67729c; }
  select { padding-right: 4px; }
  select option { background: var(--field); color: var(--text); }
  textarea { resize: vertical; min-height: 44px; }
  input:focus, select:focus, textarea:focus { border-color: var(--gold); }
  select:disabled, input:disabled { color: var(--muted); opacity: 0.7; }

  /* Chips: a select with class "chips" stays in the page (the code reads
     and sets it as before) but is hidden behind a row of pills. */
  select.chips { display: none; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip {
    font: inherit; font-size: 12px; font-weight: 500;
    color: var(--text); background: var(--field);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 10px; cursor: pointer; line-height: 1.3;
  }
  .chip:hover { border-color: var(--gold); }
  .chip.on { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); font-weight: 600; }
  .chip-empty { font-size: 11.5px; color: var(--muted); padding: 3px 0; }

  /* ---- Sticky footer ---- */
  .footer {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--card);
    border-top: 1px solid var(--line);
    padding: 8px 10px;
    display: flex; flex-direction: column; gap: 5px;
  }
  .btn {
    width: 100%;
    font-family: var(--heading); font-weight: 700; font-size: 15px; letter-spacing: 0.08em;
    color: var(--gold-ink);
    background: var(--gold);
    border: none;
    border-radius: 8px;
    padding: 8px;
    cursor: pointer;
  }
  .btn:disabled { background: #3a4677; color: var(--muted); cursor: default; }
  .hint { font-size: 10.5px; color: var(--muted); text-align: center; margin: 0; }
  .hint.good { color: var(--good); font-weight: 500; }
  .hint.bad { color: var(--bad); }
  .hint.left { text-align: left; margin-top: 3px; }

  .link {
    font: inherit;
    font-size: 11px;
    color: var(--muted);
    background: none;
    border: none;
    padding: 0;
    text-decoration: underline;
    cursor: pointer;
  }

  details { margin-top: 12px; }
  summary { font-size: 11.5px; color: var(--muted); cursor: pointer; }
  #logWindow {
    margin-top: 6px;
    max-height: 140px;
    overflow-y: auto;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 6px 8px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 10px;
    line-height: 1.5;
  }
  #logWindow a { color: var(--gold); }
  #logWindow .time { color: var(--muted); }
  #logWindow .success { color: var(--good); }
  #logWindow .error { color: var(--bad); }
</style>
</head>

<body>
<div class="panel">

  <header class="top">
    <img src="/icon.png" alt="" />
    <div>
      <div class="brand">PARTS TRACKER BRIDGE</div>
      <div class="sub">ONSHAPE &rarr; LUNA PARTS</div>
    </div>
    <div id="docInfo" class="doc"></div>
  </header>

  <nav class="tabs">
    <button class="tab active" type="button">PARTS</button>
    <button class="tab" type="button" disabled title="Coming soon">HISTORY</button>
    <a class="tab-link" href="https://build.lunatecs.org" target="_blank" rel="noopener">LUNA &#8599;</a>
  </nav>

  <div id="status" class="status"><span class="dot"></span><span id="statusText">Connecting to LUNA Parts&hellip;</span>
    <button id="simulateBtn" class="link" type="button" style="margin-left:auto">Demo part</button></div>

  <form id="partForm" class="card" autocomplete="off">
    <div class="field full">
      <label for="projectSelect">Project</label>
      <select id="projectSelect" class="chips" disabled><option value="">Loading&hellip;</option></select>
    </div>

    <div class="field">
      <label for="nameInput">Name<span class="req">*</span></label>
      <input id="nameInput" type="text" maxlength="255" />
    </div>
    <div class="field">
      <label for="partNumberInput">Part Number</label>
      <input id="partNumberInput" type="text" maxlength="255" placeholder="Auto" />
    </div>

    <div class="field full">
      <label for="statusSelect">Status<span class="req">*</span></label>
      <!-- Filled from the statuses existing LUNA parts use (the API has no
           status list); defaults to "Designed". -->
      <select id="statusSelect" class="chips" disabled><option value="">Loading&hellip;</option></select>
    </div>

    <div class="field full">
      <label for="toolSelect">Machine</label>
      <select id="toolSelect" class="chips" disabled><option value="">Loading&hellip;</option></select>
    </div>

    <div class="field full">
      <label for="materialInput">Material</label>
      <input id="materialInput" type="text" maxlength="255" />
    </div>

    <div class="field full">
      <label for="thicknessSelect">Thickness</label>
      <select id="thicknessSelect" class="chips" disabled><option value="">Loading&hellip;</option></select>
    </div>

    <div class="field full">
      <label for="typeSelect">Type<span class="req">*</span></label>
      <select id="typeSelect" class="chips">
        <option value="part">Part</option>
        <option value="assembly">Assembly</option>
        <option value="purchased">Purchased</option>
      </select>
    </div>

    <div class="field full">
      <label for="prioritySelect">Priority</label>
      <select id="prioritySelect" class="chips">
        <option value="0">Low</option>
        <option value="1" selected>Normal</option>
        <option value="2">High</option>
      </select>
    </div>

    <div class="field">
      <label for="quantityInput">Quantity<span class="req">*</span></label>
      <input id="quantityInput" type="number" min="0" step="1" value="1" />
    </div>
    <div class="field">
      <label for="leadTimeInput">Lead Time (Days)</label>
      <input id="leadTimeInput" type="number" min="0" step="1" />
    </div>

    <div class="field">
      <label for="cutLengthInput">Cut Length</label>
      <input id="cutLengthInput" type="number" min="0" step="any" />
    </div>
    <div class="field">
      <label for="parentSelect">Parent Assembly</label>
      <select id="parentSelect" disabled><option value="">None</option></select>
    </div>

    <div class="field full">
      <label for="drawingSelect">Drawing</label>
      <!-- Picked automatically when a part is clicked (e.g. part E05 ->
           "E05 Drawing 1"); exported to PDF and attached on Create Part,
           along with a DXF of the clicked face. -->
      <select id="drawingSelect" disabled><option value="">Loading&hellip;</option></select>
      <p id="attachHint" class="hint left">Click a part to attach its DXF and drawing.</p>
    </div>

    <div class="field full">
      <label for="descriptionInput">Description</label>
      <textarea id="descriptionInput" rows="2"></textarea>
    </div>
  </form>

  <details>
    <summary>Sync log</summary>
    <div id="logWindow"></div>
  </details>

</div>

<div class="footer">
  <p id="createResult" class="hint">Creates the part in LUNA Parts.</p>
  <button id="createBtn" class="btn" type="button" disabled>CREATE PART &rarr;</button>
</div>

<script>
(function () {
  // --------------------------------------------------------------------
  // MOCK DATA — stands in for a real Onshape part selection until the
  // panel reads parts from the Onshape API (the next functional step).
  // --------------------------------------------------------------------
  const MOCK_PARTS = [
    { name: 'Bracket_04',     material: '6061-T6 Aluminum',    thickness: '1/8' },
    { name: 'Gusset_Plate_A', material: '304 Stainless Steel', thickness: '3/16' },
    { name: 'Mount_Left',     material: 'A36 Steel',           thickness: '1/4' },
  ];

  const state = { connected: false, context: null, mockIndex: -1, drawings: [] };

  const el = (id) => document.getElementById(id);
  const statusBox = el('status');
  const statusText = el('statusText');
  const projectSelect = el('projectSelect');
  const toolSelect = el('toolSelect');
  const thicknessSelect = el('thicknessSelect');
  const statusSelect = el('statusSelect');
  const createBtn = el('createBtn');
  const createResult = el('createResult');
  const parentSelect = el('parentSelect');
  const drawingSelect = el('drawingSelect');
  const attachHint = el('attachHint');
  const logWindow = el('logWindow');

  // ---- Chips ---------------------------------------------------------------
  // Each <select class="chips"> is drawn as a row of pills. The select stays
  // the source of truth, so the rest of the code reads and sets .value as
  // usual and the pills follow along.
  const chipRenderers = [];
  const selectValue = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value');

  function chipify(select) {
    const row = document.createElement('div');
    row.className = 'chip-row';
    select.after(row);

    function render() {
      row.innerHTML = '';
      const options = [...select.options].filter((o) => o.value !== '');
      if (!options.length) {
        const empty = document.createElement('span');
        empty.className = 'chip-empty';
        empty.textContent = select.options[0] ? select.options[0].textContent : '';
        row.appendChild(empty);
        return;
      }
      const canClear = [...select.options].some((o) => o.value === '');
      for (const option of options) {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = option.value === select.value ? 'chip on' : 'chip';
        // "Designed (Part has been designed)" -> "Designed"; full text on hover.
        chip.textContent = option.textContent.replace(/\s*\(.*\)\s*$/, '');
        chip.title = option.textContent;
        chip.addEventListener('click', () => {
          // Tapping the picked chip again clears it, where blank is allowed.
          select.value = option.value === select.value && canClear ? '' : option.value;
          select.dispatchEvent(new Event('change', { bubbles: true }));
        });
        row.appendChild(chip);
      }
    }

    Object.defineProperty(select, 'value', {
      configurable: true,
      get() { return selectValue.get.call(this); },
      set(v) { selectValue.set.call(this, v); render(); },
    });
    new MutationObserver(render).observe(select, { childList: true });
    chipRenderers.push(render);
    render();
  }

  document.querySelectorAll('select.chips').forEach(chipify);
  // form.reset() changes values without going through the setter.
  el('partForm').addEventListener('reset', () => setTimeout(() => chipRenderers.forEach((r) => r())));

  function log(message, kind) {
    const time = new Date().toLocaleTimeString('en-US', { hour12: false });
    const line = document.createElement('div');
    if (kind) line.className = kind;
    line.innerHTML = `<span class="time">${time}</span> ${message}`;
    logWindow.appendChild(line);
    logWindow.scrollTop = logWindow.scrollHeight;
  }

  function setStatus(text, kind) {
    statusBox.className = `status ${kind}`;
    statusText.textContent = text;
  }

  function fillSelect(select, items, placeholder, label = (item) => item.name) {
    select.innerHTML = '';
    const blank = document.createElement('option');
    blank.value = '';
    blank.textContent = placeholder;
    select.appendChild(blank);
    for (const item of items) {
      const option = document.createElement('option');
      option.value = item.id;
      option.textContent = label(item);
      select.appendChild(option);
    }
    select.disabled = items.length === 0;
  }

  // ---- Load projects/tools/thicknesses from LUNA Parts (read-only) -------
  async function connect() {
    log('Loading lists from LUNA Parts&hellip;');

    try {
      const res = await fetch('/api/luna/options', { credentials: 'include' });
      const body = await res.json().catch(() => ({}));

      if (res.status === 401) {
        setStatus('Not logged in to Onshape', 'bad');
        log('Log in with Onshape first: <a href="/oauth/login">connect</a>', 'error');
        return;
      }
      if (!res.ok) throw new Error(body.error || `Server returned ${res.status}`);

      fillSelect(projectSelect, body.projects, body.projects.length ? 'Select project' : 'No projects');
      fillSelect(toolSelect, body.tools, 'Select tool');
      fillSelect(thicknessSelect, body.thicknesses, 'Select thickness');

      state.connected = true;
      setStatus('Connected to LUNA Parts', 'good');
      log(`Loaded ${body.projects.length} projects, ${body.tools.length} tools, ${body.thicknesses.length} thicknesses.`, 'success');
      loadStatuses();

      // Set when the panel was opened from inside Onshape (the extension's Action URL).
      const session = await fetch('/api/session', { credentials: 'include' }).then((r) => r.json());
      state.context = session.context;
      if (session.context) el('docInfo').textContent = `DOC ${session.context.documentId.slice(0, 6)}`;
      log(session.context
        ? `Opened in Onshape document ${session.context.documentId.slice(0, 6)}&hellip;`
        : 'Not opened from Onshape (no document info).');
      if (session.context) {
        restoreProject();
        loadDrawings();
        listenForSelections(session.context);
        warmPartIndex();
      } else {
        fillSelect(drawingSelect, [], 'Only available inside Onshape');
      }
    } catch (err) {
      setStatus('Could not reach LUNA Parts', 'bad');
      for (const s of [projectSelect, toolSelect, thicknessSelect]) {
        s.innerHTML = '<option value="">Unavailable</option>';
      }
      log(err.message, 'error');
    }
  }

  // ---- Parent Assembly depends on the chosen project ---------------------
  async function loadAssemblies(projectId) {
    fillSelect(parentSelect, [], 'None');
    if (!projectId) return;

    try {
      const res = await fetch(`/api/luna/assemblies?project_id=${encodeURIComponent(projectId)}`, { credentials: 'include' });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || `Server returned ${res.status}`);
      fillSelect(parentSelect, body.assemblies, 'None',
        (a) => `${a.partNumber} ${a.name}`);
      parentSelect.disabled = false;
    } catch (err) {
      log(err.message, 'error');
    }
  }

  // ---- Real Onshape selections ------------------------------------------
  // Onshape tells an embedded panel what the user clicked via postMessage,
  // but only after the panel introduces itself with 'applicationInit'.
  // A click on a face/edge/vertex in the 3D view arrives as that entity's
  // ID; the server works out which part owns it.
  const ONSHAPE_ORIGIN = 'https://cad.onshape.com';
  let lookupCounter = 0;

  function listenForSelections(context) {
    window.addEventListener('message', (event) => {
      if (event.origin !== ONSHAPE_ORIGIN || !event.data) return;
      if (event.data.messageName !== 'SELECTION') return;

      const selections = event.data.selections || [];
      const picked = selections.find((s) => s.selectionId);
      if (picked) {
        loadSelectedPart(picked);
      } else if (selections.length) {
        // Logged so a screenshot of the Sync log shows what Onshape sent.
        log(`Selection without an ID: ${JSON.stringify(selections[0]).slice(0, 120)}`, 'error');
      }
    });

    window.parent.postMessage({
      documentId: context.documentId,
      workspaceId: context.workspaceId,
      elementId: context.elementId,
      messageName: 'applicationInit',
    }, ONSHAPE_ORIGIN);
    log('Listening for part selections in Onshape.');
  }

  // Loads the Part Studio's part data on the server up front, so the first
  // click doesn't wait for the (large) download.
  async function warmPartIndex() {
    const started = Date.now();
    try {
      const res = await fetch('/api/onshape/warm', { method: 'POST', credentials: 'include' });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || `Server returned ${res.status}`);
      log(`Ready: ${body.parts} parts loaded from this Part Studio in ${((Date.now() - started) / 1000).toFixed(1)}s.`);
    } catch (err) {
      log(err.message, 'error');
    }
  }

  async function loadSelectedPart(selection) {
    // Clicks can arrive faster than lookups finish; only the latest one wins.
    const lookup = ++lookupCounter;
    log(`Selected ${(selection.entityType || 'entity').toLowerCase()} ${selection.selectionId}&hellip;`);
    setStatus('Loading part\u2026', 'pending');

    try {
      const res = await fetch(`/api/onshape/selected-part?selectionId=${encodeURIComponent(selection.selectionId)}`, { credentials: 'include' });
      const body = await res.json();
      if (lookup !== lookupCounter) return;
      if (!res.ok) throw new Error(body.error || `Server returned ${res.status}`);

      // Another face of the same part keeps whatever was typed; a different
      // part starts from a clean form so e.g. quantity doesn't carry over.
      if (body.partId !== state.partId) {
        resetPartFields();
        state.faceId = null;
        state.flatFace = null;
      }
      state.partId = body.partId;
      state.partName = body.name;
      // An edge or vertex click keeps the face picked earlier for the DXF.
      if (body.faceId) {
        state.faceId = body.faceId;
        state.flatFace = body.flatFace;
      }

      // The Onshape part name is the team's part number (e.g. "E05"). The
      // LUNA "Name" is a separate description the user types.
      el('partNumberInput').value = body.name;
      el('materialInput').value = body.material || '';
      pickDrawingFor(body.name);
      updateAttachHint();
      log(`Part loaded: ${body.name} (via ${body.via})`, 'success');
    } catch (err) {
      if (lookup === lookupCounter) log(err.message, 'error');
    } finally {
      if (lookup === lookupCounter) setStatus('Connected to LUNA Parts', 'good');
    }
  }

  // Everything except Project, which stays put across parts.
  function resetPartFields() {
    el('partForm').reset();
    projectSelect.value = state.projectId || '';
    statusSelect.value = state.defaultStatusId || '';
    showCreateResult('Creates the part in LUNA Parts.');
    parentSelect.value = '';
    drawingSelect.value = '';
  }

  // ---- Statuses ------------------------------------------------------------
  async function loadStatuses() {
    try {
      const res = await fetch('/api/luna/statuses', { credentials: 'include' });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || `Server returned ${res.status}`);

      fillSelect(statusSelect, body.statuses, 'Select status');
      const designed = body.statuses.find((s) => /^designed/i.test(s.name));
      state.defaultStatusId = designed ? String(designed.id) : '';
      statusSelect.value = state.defaultStatusId;
      createBtn.disabled = false;
    } catch (err) {
      fillSelect(statusSelect, [], 'Unavailable');
      log(err.message, 'error');
    }
  }

  // ---- Create Part ---------------------------------------------------------
  function showCreateResult(message, kind = '') {
    createResult.className = `hint ${kind}`;
    createResult.textContent = message;
  }

  async function createPart() {
    const value = (id) => el(id).value.trim();
    const part = {
      projectId: projectSelect.value,
      name: value('nameInput'),
      partNumber: value('partNumberInput'),
      statusId: statusSelect.value,
      type: el('typeSelect').value,
      quantity: value('quantityInput'),
      toolId: toolSelect.value,
      priority: el('prioritySelect').value,
      parentPartId: parentSelect.value,
      material: value('materialInput'),
      thicknessId: thicknessSelect.value,
      cutLength: value('cutLengthInput'),
      leadTimeDays: value('leadTimeInput'),
      description: value('descriptionInput'),
    };

    const missing = [
      [!part.projectId, 'Project'],
      [!part.name, 'Name'],
      [!part.statusId, 'Status'],
      [part.quantity === '', 'Quantity'],
    ].filter(([isMissing]) => isMissing).map(([, label]) => label);
    if (missing.length) {
      showCreateResult(`Fill in: ${missing.join(', ')}`, 'bad');
      return;
    }

    createBtn.disabled = true;
    createBtn.textContent = 'CREATING\u2026';
    try {
      const res = await fetch('/api/luna/parts', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(part),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || `Server returned ${res.status}`);

      showCreateResult(`\u2713 Created ${body.partNumber} in LUNA Parts`, 'good');
      log(`Created ${body.partNumber} "${body.name}" in LUNA Parts (id ${body.id}).`, 'success');
      if (state.partId && body.id) await attachFiles(body);
    } catch (err) {
      showCreateResult(err.message, 'bad');
      log(err.message, 'error');
    } finally {
      createBtn.disabled = false;
      createBtn.textContent = 'CREATE PART \u2192';
    }
  }

  // ---- Attachments (DXF of the clicked face + drawing PDF) ------------------
  async function attachFiles(created) {
    createBtn.textContent = 'ATTACHING FILES\u2026';
    showCreateResult(`\u2713 Created ${created.partNumber}. Attaching DXF${drawingSelect.value ? ' and drawing PDF' : ''}\u2026`, 'good');
    try {
      const res = await fetch(`/api/luna/parts/${encodeURIComponent(created.id)}/attachments`, {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          partId: state.partId,
          faceId: state.faceId,
          drawingId: drawingSelect.value,
          partNumber: created.partNumber || state.partName,
        }),
      });
      const body = await res.json().catch(() => ({}));
      for (const note of body.notes || []) log(note, 'error');
      if (!res.ok) throw new Error(body.error || `Server returned ${res.status}`);

      const notes = (body.notes || []).length ? ` (${body.notes.join(' ')})` : '';
      showCreateResult(`\u2713 Created ${created.partNumber} with ${body.attached.join(' + ')}${notes}`, 'good');
      log(`Attached ${body.attached.join(', ')} to ${created.partNumber}.`, 'success');
    } catch (err) {
      showCreateResult(`Created ${created.partNumber}, but the files weren't attached: ${err.message}`, 'bad');
      log(err.message, 'error');
    }
  }

  // Says up front what Create Part will attach, so a missing drawing is
  // obvious before the part is made.
  function updateAttachHint() {
    if (!state.partId) {
      attachHint.className = 'hint left';
      attachHint.textContent = 'Click a part to attach its DXF and drawing.';
      return;
    }
    const dxf = state.faceId
      ? (state.flatFace ? 'DXF of the clicked face' : 'DXF of the largest flat face (clicked face isn\u2019t flat)')
      : 'DXF of the largest flat face';
    if (drawingSelect.value) {
      attachHint.className = 'hint left';
      attachHint.textContent = `Will attach: ${dxf} + drawing PDF.`;
    } else {
      attachHint.className = 'hint left bad';
      const matched = (state.drawings || []).some((d) => firstWord(d.name) === firstWord(state.partName));
      attachHint.textContent = `\u26a0 ${matched ? 'No drawing chosen' : `No drawing found for ${state.partName}`}. Only the ${dxf} will be attached.`;
    }
  }

  // ---- Drawing picker ------------------------------------------------------
  async function loadDrawings() {
    try {
      const res = await fetch('/api/onshape/drawings', { credentials: 'include' });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || `Server returned ${res.status}`);
      state.drawings = body.drawings;
      fillSelect(drawingSelect, body.drawings, body.drawings.length ? 'No drawing' : 'No drawings in this document');
    } catch (err) {
      fillSelect(drawingSelect, [], 'Unavailable');
      log(err.message, 'error');
    }
  }

  // Drawings are named after their part ("E05 Drawing 1" for part E05), so
  // pick the drawing whose first word matches the part name's first word.
  function pickDrawingFor(partName) {
    const key = firstWord(partName);
    const match = (state.drawings || []).find((d) => firstWord(d.name) === key);
    drawingSelect.value = match ? match.id : '';
    if (match) log(`Drawing matched: ${match.name}`);
  }

  function firstWord(text) {
    return String(text || '').trim().split(/\s+/)[0].toLowerCase();
  }

  // ---- Remember the project per Onshape document --------------------------
  // Stored in this browser only; it just saves re-picking the project every
  // time the panel opens. Changing the dropdown updates it.
  function projectKey() {
    return state.context ? `lunaProject:${state.context.documentId}` : null;
  }

  function rememberProject(projectId) {
    state.projectId = projectId;
    const key = projectKey();
    if (!key) return;
    try {
      if (projectId) localStorage.setItem(key, projectId);
      else localStorage.removeItem(key);
    } catch (err) { /* storage blocked; nothing to remember */ }
  }

  function restoreProject() {
    const key = projectKey();
    let saved = null;
    try { saved = key && localStorage.getItem(key); } catch (err) { /* storage blocked */ }
    if (saved && [...projectSelect.options].some((o) => o.value === saved)) {
      projectSelect.value = saved;
      state.projectId = saved;
      loadAssemblies(saved);
      log(`Project remembered for this document: ${projectSelect.selectedOptions[0].textContent}`);
    }
  }

  // ---- Simulated Onshape part selection ----------------------------------
  function fillDemoPart() {
    state.mockIndex = (state.mockIndex + 1) % MOCK_PARTS.length;
    const part = MOCK_PARTS[state.mockIndex];

    resetPartFields();
    el('partNumberInput').value = part.name;
    el('materialInput').value = part.material;
    pickDrawingFor(part.name);
    // Match the thickness to LUNA's list by name where one lines up.
    const match = [...thicknessSelect.options].find((o) => o.value && o.textContent.includes(part.thickness));
    thicknessSelect.value = match ? match.value : '';

    log(`Demo part filled: ${part.name}`);
  }

  projectSelect.addEventListener('change', () => {
    rememberProject(projectSelect.value);
    loadAssemblies(projectSelect.value);
  });
  el('simulateBtn').addEventListener('click', fillDemoPart);
  createBtn.addEventListener('click', createPart);
  drawingSelect.addEventListener('change', updateAttachHint);

  connect();
})();
</script>
</body>
</html>
