<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Parts Tracker Bridge</title>

<!-- Same font LUNA Parts uses, so the panel reads as part of the tracker. -->
<link rel="preconnect" href="https://fonts.bunny.net" />
<link href="https://fonts.bunny.net/css?family=instrument-sans:400,500,600" rel="stylesheet" />

<style>
  /* Styled after LUNA Parts' own "Create Part" form, condensed to fit
     Onshape's ~300px right panel: two fields per row where they're short. */
  :root {
    --text: #1b1b18;
    --label: #3f3f46;
    --muted: #71717a;
    --border: #e4e4e7;
    --field-bg: #ffffff;
    --readonly-bg: #f3f4f6;
    --required: #ef4444;
    --good: #16a34a;
    --bad: #dc2626;
    --pending: #d97706;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #ffffff;
    color: var(--text);
    font-family: 'Instrument Sans', ui-sans-serif, system-ui, sans-serif;
    font-size: 13px;
  }

  .panel { padding: 12px; }

  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .head h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }

  .status { display: flex; align-items: center; gap: 6px; margin: 4px 0 10px; font-size: 11.5px; color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pending); flex-shrink: 0; }
  .status.good .dot { background: var(--good); }
  .status.bad .dot { background: var(--bad); }
  .status.bad { color: var(--bad); }

  .card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 10px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px 8px;
  }

  .field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .field.full { grid-column: 1 / -1; }

  label { font-size: 12px; font-weight: 500; color: var(--label); }
  .req { color: var(--required); margin-left: 1px; }

  input, select, textarea {
    width: 100%;
    font: inherit;
    font-size: 12.5px;
    color: var(--text);
    background: var(--field-bg);
    border: 1px solid transparent;
    border-radius: 7px;
    padding: 6px 8px;
    box-shadow: 0 0 0 1px rgba(24, 24, 27, 0.06), 0 1px 2px rgba(24, 24, 27, 0.08);
    outline: none;
  }
  select { padding-right: 4px; }
  textarea { resize: vertical; min-height: 44px; }
  input:focus, select:focus, textarea:focus { box-shadow: 0 0 0 2px rgba(24, 24, 27, 0.35); }
  select:disabled, input:disabled { background: var(--readonly-bg); color: var(--muted); }

  .actions { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .btn {
    width: 100%;
    font: inherit;
    font-weight: 600;
    font-size: 13px;
    color: #ffffff;
    background: #1b1b18;
    border: none;
    border-radius: 7px;
    padding: 8px;
    cursor: pointer;
  }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .hint { font-size: 10.5px; color: var(--muted); text-align: center; margin: 0; }

  .link {
    font: inherit;
    font-size: 11px;
    color: var(--muted);
    background: none;
    border: none;
    padding: 0;
    text-decoration: underline;
    cursor: pointer;
  }

  details { margin-top: 12px; }
  summary { font-size: 11.5px; color: var(--muted); cursor: pointer; }
  #logWindow {
    margin-top: 6px;
    max-height: 120px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 6px 8px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 10px;
    line-height: 1.5;
  }
  #logWindow .time { color: var(--muted); }
  #logWindow .success { color: var(--good); }
  #logWindow .error { color: var(--bad); }
</style>
</head>

<body>
<div class="panel">

  <div class="head">
    <h1>Create Part</h1>
    <button id="simulateBtn" class="link" type="button">Fill demo part</button>
  </div>
  <div id="status" class="status"><span class="dot"></span><span id="statusText">Connecting to LUNA Parts&hellip;</span></div>

  <form id="partForm" class="card" autocomplete="off">
    <div class="field full">
      <label for="projectSelect">Project</label>
      <select id="projectSelect" disabled><option value="">Loading&hellip;</option></select>
    </div>

    <div class="field">
      <label for="nameInput">Name<span class="req">*</span></label>
      <input id="nameInput" type="text" maxlength="255" />
    </div>
    <div class="field">
      <label for="partNumberInput">Part Number</label>
      <input id="partNumberInput" type="text" maxlength="255" placeholder="Auto" />
    </div>

    <div class="field">
      <label for="statusSelect">Status<span class="req">*</span></label>
      <!-- LUNA Parts' API has no way to list statuses yet, so this is fixed
           until we get the real status IDs from the LUNA Parts team. -->
      <select id="statusSelect" disabled><option value="">Designed</option></select>
    </div>
    <div class="field">
      <label for="typeSelect">Type<span class="req">*</span></label>
      <select id="typeSelect">
        <option value="part">Part</option>
        <option value="assembly">Assembly</option>
        <option value="purchased">Purchased</option>
      </select>
    </div>

    <div class="field">
      <label for="toolSelect">Tool</label>
      <select id="toolSelect" disabled><option value="">Loading&hellip;</option></select>
    </div>
    <div class="field">
      <label for="prioritySelect">Priority</label>
      <select id="prioritySelect">
        <option value="0">Low</option>
        <option value="1" selected>Normal</option>
        <option value="2">High</option>
      </select>
    </div>

    <div class="field full">
      <label for="parentSelect">Parent Assembly</label>
      <select id="parentSelect" disabled><option value="">No Parent Assembly</option></select>
    </div>

    <div class="field full">
      <label for="materialInput">Material</label>
      <input id="materialInput" type="text" maxlength="255" />
    </div>

    <div class="field">
      <label for="thicknessSelect">Thickness</label>
      <select id="thicknessSelect" disabled><option value="">Loading&hellip;</option></select>
    </div>
    <div class="field">
      <label for="quantityInput">Quantity<span class="req">*</span></label>
      <input id="quantityInput" type="number" min="0" step="1" value="1" />
    </div>

    <div class="field">
      <label for="cutLengthInput">Cut Length</label>
      <input id="cutLengthInput" type="number" min="0" step="any" />
    </div>
    <div class="field">
      <label for="leadTimeInput">Lead Time (Days)</label>
      <input id="leadTimeInput" type="number" min="0" step="1" />
    </div>

    <div class="field full">
      <label for="drawingSelect">Drawing</label>
      <!-- Picked automatically when a part is clicked (e.g. part E05 ->
           "E05 Drawing 1"); exported to PDF and attached in a later step. -->
      <select id="drawingSelect" disabled><option value="">Loading&hellip;</option></select>
    </div>

    <div class="field full">
      <label for="descriptionInput">Description</label>
      <textarea id="descriptionInput" rows="2"></textarea>
    </div>
  </form>

  <div class="actions">
    <button id="createBtn" class="btn" type="button" disabled>Create Part</button>
    <p class="hint">Saving to LUNA Parts is the next step &mdash; this button isn&rsquo;t wired up yet.</p>
  </div>

  <details>
    <summary>Sync log</summary>
    <div id="logWindow"></div>
  </details>

</div>

<script>
(function () {
  // --------------------------------------------------------------------
  // MOCK DATA — stands in for a real Onshape part selection until the
  // panel reads parts from the Onshape API (the next functional step).
  // --------------------------------------------------------------------
  const MOCK_PARTS = [
    { name: 'Bracket_04',     material: '6061-T6 Aluminum',    thickness: '1/8' },
    { name: 'Gusset_Plate_A', material: '304 Stainless Steel', thickness: '3/16' },
    { name: 'Mount_Left',     material: 'A36 Steel',           thickness: '1/4' },
  ];

  const state = { connected: false, context: null, mockIndex: -1, drawings: [] };

  const el = (id) => document.getElementById(id);
  const statusBox = el('status');
  const statusText = el('statusText');
  const projectSelect = el('projectSelect');
  const toolSelect = el('toolSelect');
  const thicknessSelect = el('thicknessSelect');
  const parentSelect = el('parentSelect');
  const drawingSelect = el('drawingSelect');
  const logWindow = el('logWindow');

  function log(message, kind) {
    const time = new Date().toLocaleTimeString('en-US', { hour12: false });
    const line = document.createElement('div');
    if (kind) line.className = kind;
    line.innerHTML = `<span class="time">${time}</span> ${message}`;
    logWindow.appendChild(line);
    logWindow.scrollTop = logWindow.scrollHeight;
  }

  function setStatus(text, kind) {
    statusBox.className = `status ${kind}`;
    statusText.textContent = text;
  }

  function fillSelect(select, items, placeholder, label = (item) => item.name) {
    select.innerHTML = '';
    const blank = document.createElement('option');
    blank.value = '';
    blank.textContent = placeholder;
    select.appendChild(blank);
    for (const item of items) {
      const option = document.createElement('option');
      option.value = item.id;
      option.textContent = label(item);
      select.appendChild(option);
    }
    select.disabled = items.length === 0;
  }

  // ---- Load projects/tools/thicknesses from LUNA Parts (read-only) -------
  async function connect() {
    log('Loading lists from LUNA Parts&hellip;');

    try {
      const res = await fetch('/api/luna/options', { credentials: 'include' });
      const body = await res.json().catch(() => ({}));

      if (res.status === 401) {
        setStatus('Not logged in to Onshape', 'bad');
        log('Log in with Onshape first: <a href="/oauth/login">connect</a>', 'error');
        return;
      }
      if (!res.ok) throw new Error(body.error || `Server returned ${res.status}`);

      fillSelect(projectSelect, body.projects, body.projects.length ? 'Select project' : 'No projects');
      fillSelect(toolSelect, body.tools, 'Select tool');
      fillSelect(thicknessSelect, body.thicknesses, 'Select thickness');

      state.connected = true;
      setStatus('Connected to LUNA Parts', 'good');
      log(`Loaded ${body.projects.length} projects, ${body.tools.length} tools, ${body.thicknesses.length} thicknesses.`, 'success');

      // Set when the panel was opened from inside Onshape (the extension's Action URL).
      const session = await fetch('/api/session', { credentials: 'include' }).then((r) => r.json());
      state.context = session.context;
      log(session.context
        ? `Opened in Onshape document ${session.context.documentId.slice(0, 6)}&hellip;`
        : 'Not opened from Onshape (no document info).');
      if (session.context) {
        restoreProject();
        loadDrawings();
        listenForSelections(session.context);
        warmPartIndex();
      } else {
        fillSelect(drawingSelect, [], 'Only available inside Onshape');
      }
    } catch (err) {
      setStatus('Could not reach LUNA Parts', 'bad');
      for (const s of [projectSelect, toolSelect, thicknessSelect]) {
        s.innerHTML = '<option value="">Unavailable</option>';
      }
      log(err.message, 'error');
    }
  }

  // ---- Parent Assembly depends on the chosen project ---------------------
  async function loadAssemblies(projectId) {
    fillSelect(parentSelect, [], 'No Parent Assembly');
    if (!projectId) return;

    try {
      const res = await fetch(`/api/luna/assemblies?project_id=${encodeURIComponent(projectId)}`, { credentials: 'include' });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || `Server returned ${res.status}`);
      fillSelect(parentSelect, body.assemblies, 'No Parent Assembly',
        (a) => `${a.partNumber} ${a.name}`);
      parentSelect.disabled = false;
    } catch (err) {
      log(err.message, 'error');
    }
  }

  // ---- Real Onshape selections ------------------------------------------
  // Onshape tells an embedded panel what the user clicked via postMessage,
  // but only after the panel introduces itself with 'applicationInit'.
  // A click on a face/edge/vertex in the 3D view arrives as that entity's
  // ID; the server works out which part owns it.
  const ONSHAPE_ORIGIN = 'https://cad.onshape.com';
  let lookupCounter = 0;

  function listenForSelections(context) {
    window.addEventListener('message', (event) => {
      if (event.origin !== ONSHAPE_ORIGIN || !event.data) return;
      if (event.data.messageName !== 'SELECTION') return;

      const selections = event.data.selections || [];
      const picked = selections.find((s) => s.selectionId);
      if (picked) {
        loadSelectedPart(picked);
      } else if (selections.length) {
        // Logged so a screenshot of the Sync log shows what Onshape sent.
        log(`Selection without an ID: ${JSON.stringify(selections[0]).slice(0, 120)}`, 'error');
      }
    });

    window.parent.postMessage({
      documentId: context.documentId,
      workspaceId: context.workspaceId,
      elementId: context.elementId,
      messageName: 'applicationInit',
    }, ONSHAPE_ORIGIN);
    log('Listening for part selections in Onshape.');
  }

  // Loads the Part Studio's part data on the server up front, so the first
  // click doesn't wait for the (large) download.
  async function warmPartIndex() {
    const started = Date.now();
    try {
      const res = await fetch('/api/onshape/warm', { method: 'POST', credentials: 'include' });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || `Server returned ${res.status}`);
      log(`Ready: ${body.parts} parts loaded from this Part Studio in ${((Date.now() - started) / 1000).toFixed(1)}s.`);
    } catch (err) {
      log(err.message, 'error');
    }
  }

  async function loadSelectedPart(selection) {
    // Clicks can arrive faster than lookups finish; only the latest one wins.
    const lookup = ++lookupCounter;
    log(`Selected ${(selection.entityType || 'entity').toLowerCase()} ${selection.selectionId}&hellip;`);
    setStatus('Loading part\u2026', 'pending');

    try {
      const res = await fetch(`/api/onshape/selected-part?selectionId=${encodeURIComponent(selection.selectionId)}`, { credentials: 'include' });
      const body = await res.json();
      if (lookup !== lookupCounter) return;
      if (!res.ok) throw new Error(body.error || `Server returned ${res.status}`);

      // Another face of the same part keeps whatever was typed; a different
      // part starts from a clean form so e.g. quantity doesn't carry over.
      if (body.partId !== state.partId) resetPartFields();
      state.partId = body.partId;

      // The Onshape part name is the team's part number (e.g. "E05"). The
      // LUNA "Name" is a separate description the user types.
      el('partNumberInput').value = body.name;
      el('materialInput').value = body.material || '';
      pickDrawingFor(body.name);
      log(`Part loaded: ${body.name} (via ${body.via})`, 'success');
    } catch (err) {
      if (lookup === lookupCounter) log(err.message, 'error');
    } finally {
      if (lookup === lookupCounter) setStatus('Connected to LUNA Parts', 'good');
    }
  }

  // Everything except Project, which stays put across parts.
  function resetPartFields() {
    el('partForm').reset();
    projectSelect.value = state.projectId || '';
    parentSelect.value = '';
    drawingSelect.value = '';
  }

  // ---- Drawing picker ------------------------------------------------------
  async function loadDrawings() {
    try {
      const res = await fetch('/api/onshape/drawings', { credentials: 'include' });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || `Server returned ${res.status}`);
      state.drawings = body.drawings;
      fillSelect(drawingSelect, body.drawings, body.drawings.length ? 'No drawing' : 'No drawings in this document');
    } catch (err) {
      fillSelect(drawingSelect, [], 'Unavailable');
      log(err.message, 'error');
    }
  }

  // Drawings are named after their part ("E05 Drawing 1" for part E05), so
  // pick the drawing whose first word matches the part name's first word.
  function pickDrawingFor(partName) {
    const key = firstWord(partName);
    const match = (state.drawings || []).find((d) => firstWord(d.name) === key);
    drawingSelect.value = match ? match.id : '';
    if (match) log(`Drawing matched: ${match.name}`);
  }

  function firstWord(text) {
    return String(text || '').trim().split(/\s+/)[0].toLowerCase();
  }

  // ---- Remember the project per Onshape document --------------------------
  // Stored in this browser only; it just saves re-picking the project every
  // time the panel opens. Changing the dropdown updates it.
  function projectKey() {
    return state.context ? `lunaProject:${state.context.documentId}` : null;
  }

  function rememberProject(projectId) {
    state.projectId = projectId;
    const key = projectKey();
    if (!key) return;
    try {
      if (projectId) localStorage.setItem(key, projectId);
      else localStorage.removeItem(key);
    } catch (err) { /* storage blocked; nothing to remember */ }
  }

  function restoreProject() {
    const key = projectKey();
    let saved = null;
    try { saved = key && localStorage.getItem(key); } catch (err) { /* storage blocked */ }
    if (saved && [...projectSelect.options].some((o) => o.value === saved)) {
      projectSelect.value = saved;
      state.projectId = saved;
      loadAssemblies(saved);
      log(`Project remembered for this document: ${projectSelect.selectedOptions[0].textContent}`);
    }
  }

  // ---- Simulated Onshape part selection ----------------------------------
  function fillDemoPart() {
    state.mockIndex = (state.mockIndex + 1) % MOCK_PARTS.length;
    const part = MOCK_PARTS[state.mockIndex];

    resetPartFields();
    el('partNumberInput').value = part.name;
    el('materialInput').value = part.material;
    pickDrawingFor(part.name);
    // Match the thickness to LUNA's list by name where one lines up.
    const match = [...thicknessSelect.options].find((o) => o.value && o.textContent.includes(part.thickness));
    thicknessSelect.value = match ? match.value : '';

    log(`Demo part filled: ${part.name}`);
  }

  projectSelect.addEventListener('change', () => {
    rememberProject(projectSelect.value);
    loadAssemblies(projectSelect.value);
  });
  el('simulateBtn').addEventListener('click', fillDemoPart);

  connect();
})();
</script>
</body>
</html>
